$kind: http-example
request:
  url: "{{baseUrl}}/v1/accounts"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Idempotency-Key
      value: pay-2026-11-14-0001
      disabled: false
      description: (Required) Makes a write safe to retry. The same key with the same request returns the original result; with a different request, `409 idempotency_key_reused`. Keys are per client and kept for at least 30 days (ADR-0008).
    - key: Accept
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "reference": "2010:cust-abebe"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:invalid_reference",
        "title": "The chart reference is invalid or not open for accounts",
        "status": 422,
        "code": "invalid_reference",
        "detail": "The chart reference is invalid or not open for accounts.",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 6000
