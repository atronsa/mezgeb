$kind: http-request
description: "The P-256 public keys that sign device certificates and vouchers, oldest first. Retired keys stay listed, so old vouchers remain verifiable."
url: "{{baseUrl}}/v1/offline/issuer-keys"
method: GET
headers:
  - key: Accept
    value: application/json
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /oauth/token
    scope: accounts:read accounts:read_all accounts:write accounts:admin operations:write entries:read corrections:write adjustments:request adjustments:approve holds:read holds:write periods:read periods:close reports:read offline:write
    grant_type: client_credentials
settings: {}
examples: ./.resources/List the offline issuer keys.resources/examples
order: 4000
