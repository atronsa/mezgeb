$kind: http-request
description: "Registers a payer device's P-256 public key for a customer wallet and returns its device certificate, signed by the issuer key (protocol §5). Only `none` attestation is accepted for now, earning tier C if the client has enabled it. The public key identifies the request: registering it again with the same details returns the device."
url: "{{baseUrl}}/v1/offline/devices"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "owner_account": "2010:cust-hana",
      "public_key": "03ca16e9076330c0c89ff8738477b10113a8d324b21e95863ef1f442035b1203c1",
      "label": "Hana's phone",
      "attestation": {
        "type": "none"
      }
    }
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /oauth/token
    scope: accounts:read accounts:read_all accounts:write accounts:admin operations:write entries:read corrections:write adjustments:request adjustments:approve holds:read holds:write periods:read periods:close reports:read offline:write
    grant_type: client_credentials
settings: {}
examples: ./.resources/Register an offline device.resources/examples
order: 1000
