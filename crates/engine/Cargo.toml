[package]
name = "mezgeb-engine"
description = "Posting engine: writes balanced entries, holds and reversals to PostgreSQL."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mezgeb-core.workspace = true
mezgeb-offline.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
# v7: the expiry worker mints the IDs of the entries it posts.
uuid = { workspace = true, features = ["v7"] }
tokio.workspace = true
argon2 = "0.6"
getrandom = "0.4"
sha2.workspace = true
# Bank statement mappings (step 2.15).
toml.workspace = true
ed25519-dalek = "3"

[features]
# Failure-injection hooks for tests only. Never enable in a build that runs
# against real money.
test-hooks = []

[dev-dependencies]
mezgeb-engine = { path = ".", features = ["test-hooks"] }
tokio.workspace = true
proptest.workspace = true
uuid.workspace = true

[lints]
workspace = true
