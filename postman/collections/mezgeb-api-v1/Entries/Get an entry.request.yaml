$kind: http-request
description: An entry with its lines, kind, template, period and links to the entry it reverses or refunds.
url: "{{baseUrl}}/v1/entries/:entry_id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: entry_id
    value: 29b46c48-b477-782c-b68b-e0edd5ef8070
    disabled: false
    description: (Required) The entry.
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /oauth/token
    scope: accounts:read accounts:read_all accounts:write accounts:admin operations:write entries:read corrections:write adjustments:request adjustments:approve holds:read holds:write periods:read periods:close reports:read offline:write
    grant_type: client_credentials
settings: {}
examples: ./.resources/Get an entry.resources/examples
order: 1000
