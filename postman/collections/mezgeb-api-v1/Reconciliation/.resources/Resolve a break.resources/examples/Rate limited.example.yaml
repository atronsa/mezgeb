$kind: http-example
request:
  url: "{{baseUrl}}/v1/reconciliation/breaks/:break_id/resolve"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/problem+json
  pathVariables:
    - key: break_id
      value: 5cae026c-278e-7ac0-b56f-144db7afb1b8
      disabled: false
      description: (Required) The break.
  body:
    type: json
    content: |-
      {
        "entry_id": "0192f3c4-0000-7000-8000-000000000e09"
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    - key: Retry-After
      value: "1909"
      disabled: false
      description: Seconds to wait before retrying.
    - key: Content-Type
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:rate_limited",
        "title": "Too many requests",
        "status": 429,
        "code": "rate_limited",
        "detail": "Too many requests.",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 7000
