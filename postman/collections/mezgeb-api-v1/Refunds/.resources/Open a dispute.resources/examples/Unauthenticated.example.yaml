$kind: http-example
request:
  url: "{{baseUrl}}/v1/operations/dispute_open.v1"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Idempotency-Key
      value: pay-2026-11-14-0001
      disabled: false
      description: (Required) Makes a write safe to retry. The same key with the same request returns the original result; with a different request, `409 idempotency_key_reused`. Keys are per client and kept for at least 30 days (ADR-0008).
    - key: Accept
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "accounts": {
          "merchant_balance": "2030:merch-coffee",
          "dispute_item": "2060:dsp-0001"
        },
        "amounts": {
          "amount": {
            "amount": "100.00",
            "currency": "ETB"
          }
        },
        "metadata": {
          "disputed_entry": "0192f3c4-0000-7000-8000-000000000009"
        }
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:unauthenticated",
        "title": "Authentication is required",
        "status": 401,
        "code": "unauthenticated",
        "detail": "Authentication is required.",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 4000
