# Local PostgreSQL for development and database tests, and the service.
#
#   docker compose up -d                  PostgreSQL (first start creates the roles)
#   docker compose --profile api up -d    also migrate, seed the dev clients
#                                         and start mezgeb-api on :8080
#   docker compose down                   stop and delete the data
#
# Port 55432 avoids clashing with a PostgreSQL already on 5432.
# The passwords and tokens here are for local development only.

services:
  postgres:
    image: postgres:18-alpine
    # Docker's default 64 MB of shared memory is too small for PostgreSQL's
    # parallel queries on large tables (verification on a million lines).
    shm_size: 1gb
    # pg_stat_statements: which statements take the time
    # (`mezgeb-bench --statements`, step 1.16).
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Applies the migrations as mezgeb_owner, then exits.
  migrate:
    profiles: [api]
    build: .
    command: ["mezgeb-cli", "migrate"]
    environment:
      MEZGEB_DATABASE_URL: postgres://mezgeb_owner:mezgeb_owner@postgres:5432/mezgeb
    depends_on:
      postgres:
        condition: service_healthy

  # Creates the development clients and credentials of
  # deploy/clients.dev.toml as mezgeb_admin, then exits.
  seed:
    profiles: [api]
    build: .
    command: ["mezgeb-cli", "client", "seed", "/etc/mezgeb/clients.toml"]
    environment:
      MEZGEB_DATABASE_URL: postgres://mezgeb_admin:mezgeb_admin@postgres:5432/mezgeb
    volumes:
      - ./deploy/clients.dev.toml:/etc/mezgeb/clients.toml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    profiles: [api]
    build: .
    environment:
      MEZGEB_DATABASE_URL: postgres://mezgeb_app:mezgeb_app@postgres:5432/mezgeb
    ports:
      - "8080:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
