$kind: http-request
description: "Uploads up to 100 offline receipts, from the payer's device or the payee's terminal, each as the exact bytes the device signed and its signature, in hex. Each receipt gets its own outcome, whoever uploads it and however often; settling one also settles the receipts that were waiting for it. Repeating an upload is always safe."
url: "{{baseUrl}}/v1/offline/receipts"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "receipts": [
        {
          "body": "6d657a6765622e6f66666c696e652e726563656970742e763100",
          "signature": "abababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababab"
        }
      ]
    }
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /oauth/token
    scope: accounts:read accounts:read_all accounts:write accounts:admin operations:write entries:read corrections:write adjustments:request adjustments:approve holds:read holds:write periods:read periods:close reports:read offline:write
    grant_type: client_credentials
settings: {}
examples: ./.resources/Submit offline receipts.resources/examples
order: 3000
