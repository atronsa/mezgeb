            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                public_key_registered:
                  $ref: "#/components/examples/error-public_key_registered"
        "422":
          description: "The device was refused"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                owner_not_a_wallet:
                  $ref: "#/components/examples/error-owner_not_a_wallet"
                tier_disabled:
                  $ref: "#/components/examples/error-tier_disabled"
                attestation_unsupported:
                  $ref: "#/components/examples/error-attestation_unsupported"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: "Unavailable, or offline payments are not configured"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                offline_unavailable:
