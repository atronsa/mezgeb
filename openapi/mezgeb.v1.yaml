    P256Signature:
      type: "string"
      pattern: "^[0-9a-f]{128}$"
      description: "An ECDSA P-256 signature, r || s with low s, in lower-case hex."
    SignedBody:
      type: "string"
      pattern: "^([0-9a-f]{2})+$"
      description: "The exact bytes signed, in lower-case hex (protocol §3)."
    Device:
      type: "object"
      additionalProperties: false
