$kind: http-request
description: Every line of the account from `from` (inclusive) to `to` (exclusive), by posting time, in posting order, with the balance after each line. The first page carries the opening balance; pages continue with `cursor`.
url: '{{baseUrl}}/v1/accounts/:account_id/ledger?from=2026-11-01T00:00:00Z&to=2026-12-01T00:00:00Z&limit=50'
method: GET
headers:
  Accept: application/json
queryParams:
  - key: from
    value: '2026-11-01T00:00:00Z'
    description: (Required) Start, RFC 3339, inclusive.
  - key: to
    value: '2026-12-01T00:00:00Z'
    description: (Required) End, RFC 3339, exclusive.
  - key: limit
    value: '50'
    description: Page size.
pathVariables:
  - key: account_id
    value: db42271e-18fb-74c3-be54-32899ef41292
    disabled: false
    description: (Required) The account.
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /oauth/token
    scope: accounts:read accounts:read_all accounts:write accounts:admin operations:write entries:read corrections:write adjustments:request adjustments:approve holds:read holds:write periods:read periods:close reports:read offline:write
    grant_type: client_credentials
settings: {}
examples: ./.resources/Get the account history.resources/examples
order: 5000
