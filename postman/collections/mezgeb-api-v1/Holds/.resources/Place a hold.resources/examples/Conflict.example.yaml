$kind: http-example
request:
  url: "{{baseUrl}}/v1/holds"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Idempotency-Key
      value: pay-2026-11-14-0001
      disabled: false
      description: (Required) Makes a write safe to retry. The same key with the same request returns the original result; with a different request, `409 idempotency_key_reused`. Keys are per client and kept for at least 30 days (ADR-0008).
    - key: Accept
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "account": "2010:cust-abebe",
        "held_account": "2010:cust-abebe-hold-0001",
        "amount": {
          "amount": "300.00",
          "currency": "ETB"
        },
        "expires_at": "2026-11-15T09:00:00Z"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:idempotency_key_reused",
        "title": "The idempotency key was used for a different request",
        "status": 409,
        "code": "idempotency_key_reused",
        "detail": "Idempotency key \"pay-0001\" was already used for a different request.",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 6000
