$kind: http-example
name: The hold.
request:
  url: "{{baseUrl}}/v1/holds/:hold_id"
  method: GET
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/json
  pathVariables:
    - key: hold_id
      value: df1b2b83-8b54-739e-852e-21a0f85d0007
      disabled: false
      description: (Required) The hold.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "0192f3c4-0000-7000-9000-000000000001",
        "account": "0192f3c4-0000-7000-8000-000000000002",
        "held_account": "0192f3c4-0000-7000-8000-00000000000a",
        "amount": {
          "amount": "300.00",
          "currency": "ETB"
        },
        "captured": {
          "amount": "0.00",
          "currency": "ETB"
        },
        "status": "active",
        "expires_at": "2026-11-15T09:00:00Z",
        "place_entry": "0192f3c4-0000-7000-8000-000000000011",
        "close_entry": null
      }
order: 1000
