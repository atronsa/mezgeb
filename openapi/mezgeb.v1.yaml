      summary: "List the offline issuer keys"
      description: "The P-256 public keys that sign device certificates and vouchers, oldest first. Retired keys stay listed, so old vouchers remain verifiable. Apps and terminals check a voucher's signature with the key its `issuer_key_id` names."
      security:
        - oauth2:
            - "offline:write"
      responses:
        "200":
          description: "The keys"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuerKeyList"
              example:
                items:
                  - key_id: "8356ab979cb1fbd8"
                    public_key: "02b7c6a1f0e2d3c4b5a69788796a5b4c3d2e1f00112233445566778899aabbccdd"
                    added_at: "2026-11-16T00:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/offline/receipts:
    post:
      operationId: "submitReceipts"
      tags:
        - "Offline"
      summary: "Submit offline receipts"
      description: "Uploads up to 100 offline receipts, from the payer's device or the payee's terminal, each as the exact bytes the device signed and its signature, in hex (protocol §8–§9). Each receipt gets its own outcome, whoever uploads it and however often: `SETTLED` pays it from escrow (E17, booked by `offline_receipt_settle.v1`, with the client's merchant fee); `DUPLICATE` means it was already recorded; `WAITING_FOR_GAP` keeps it until the earlier counters arrive, and settling a receipt also settles those waiting for it, listed in `settled`; `CONFLICT` and `OVER_LIMIT` freeze the device and its voucher; `FROZEN` keeps it for the dispute; `BAD_FORMAT`, `BAD_SIGNATURE`, `UNKNOWN_DEVICE` and `UNKNOWN_VOUCHER` record nothing. The upload is not one transaction: each receipt is decided on its own, and repeating an upload is always safe."
      security:
        - oauth2:
            - "offline:write"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfflineReceiptsRequest"
            example:
              receipts:
                - body: "6d657a6765622e6f66666c696e652e726563656970742e763100"
                  signature: "abababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababab"
      responses:
        "200":
          description: "One result per receipt, in upload order."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptUploadResults"
              example:
                results:
                  - index: 0
                    outcome: "SETTLED"
                    device: "0192f3c4-0000-7000-8000-000000000d01"
                    counter: 1
                    digest: "e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3"
                    entry: "0192f3c4-0000-7000-8000-000000000e11"
                    detail: null
                    settled:
                      - counter: 1
                        entry: "0192f3c4-0000-7000-8000-000000000e11"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          description: "A receipt of a voucher already returned: late receipts settle from step 2.13"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                not_implemented:
                  $ref: "#/components/examples/error-not_implemented"
        "503":
          description: "Unavailable"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                busy:
                  $ref: "#/components/examples/error-busy"
                contention:
                  $ref: "#/components/examples/error-contention"
                no_open_period:
                  $ref: "#/components/examples/error-no_open_period"
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
  /v1/keys:
    get:
      operationId: "listSigningKeys"
      tags:
        - "Audit"
      summary: "List the signing keys"
      description: "The public keys that sign receipts and checkpoints, by key ID. Retired keys stay listed, so old signatures remain verifiable."
      security:
