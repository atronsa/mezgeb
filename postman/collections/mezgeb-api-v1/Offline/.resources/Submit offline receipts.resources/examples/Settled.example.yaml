$kind: http-example
name: "One result per receipt."
request:
  url: "{{baseUrl}}/v1/offline/receipts"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "receipts": [
          {
            "body": "6d657a6765622e6f66666c696e652e726563656970742e763100",
            "signature": "abababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababab"
          }
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "results": [
          {
            "index": 0,
            "outcome": "SETTLED",
            "device": "0192f3c4-0000-7000-8000-000000000d01",
            "counter": 1,
            "digest": "e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3",
            "entry": "0192f3c4-0000-7000-8000-000000000e11",
            "detail": null,
            "settled": [
              {
                "counter": 1,
                "entry": "0192f3c4-0000-7000-8000-000000000e11"
              }
            ]
          }
        ]
      }
order: 500
