$kind: http-request
description: "Closes a break that is not about money in an account (`statement_conflict`, `stale_cache`, and the offline kinds) with the operator's reason (ADR-0020 decision 8). A money break is refused: it closes only when a later run matches it or a suspense entry resolves it. For the operator's staff."
url: "{{baseUrl}}/v1/reconciliation/breaks/:break_id/explain"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: break_id
    value: 0192f3c4-0000-7000-8000-00000000b001
    disabled: false
    description: (Required) The break.
body:
  type: json
  content: |-
    {
      "reason": "The bank corrected its export; the first copy is right."
    }
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /oauth/token
    scope: accounts:read accounts:read_all accounts:write accounts:admin operations:write entries:read corrections:write adjustments:request adjustments:approve holds:read holds:write periods:read periods:close reports:read audit:read offline:write offline:resolve reconciliation:write reconciliation:read reconciliation:resolve
    grant_type: client_credentials
settings: {}
examples: ./.resources/Explain a break.resources/examples
order: 7000
