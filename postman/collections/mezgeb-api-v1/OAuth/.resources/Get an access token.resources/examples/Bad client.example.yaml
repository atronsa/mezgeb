$kind: http-example
request:
  url: "{{baseUrl}}/oauth/token"
  method: POST
  headers:
    - key: Authorization
      value: Basic <client_id:client_secret>
      description: "Added as a part of security scheme: clientSecretBasic"
    - key: Content-Type
      value: application/x-www-form-urlencoded
  body:
    type: text
    content: grant_type=client_credentials&scope=accounts%3Aread%20operations%3Awrite
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/json
    - key: Cache-Control
      value: "no-store"
    - key: WWW-Authenticate
      value: "Basic realm=\"mezgeb\""
  body:
    type: json
    content: |-
      {
        "error": "invalid_client",
        "error_description": "Client authentication failed."
      }
order: 3000
