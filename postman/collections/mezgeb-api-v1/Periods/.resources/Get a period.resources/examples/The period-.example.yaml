$kind: http-example
name: The period.
request:
  url: "{{baseUrl}}/v1/periods/:period_id"
  method: GET
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/json
  pathVariables:
    - key: period_id
      value: "2330"
      disabled: false
      description: (Required) The period.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 12,
        "label": "2026-11-14",
        "status": "closed",
        "opened_at": "2026-11-14T00:00:03.120000Z",
        "after_sequence": 812003,
        "last_sequence": 845913,
        "closing_at": "2026-11-15T00:00:02.904000Z",
        "closed_at": "2026-11-15T00:00:05.511000Z"
      }
order: 1000
