components:
  securitySchemes:
    oauth2:
      type: "oauth2"
      description: "OAuth 2.0 client credentials. Each client is a platform integrating with the ledger; operator tokens carry operator scopes. Designed in step 2.08."
      flows:
        clientCredentials:
          tokenUrl: "/oauth/token"
          scopes:
            "accounts:read": "Read the accounts the client owns"
            "accounts:read_all": "Read every account (operator)"
            "accounts:write": "Open accounts"
            "accounts:admin": "Freeze, unfreeze and close accounts (operator)"
            "operations:write": "Post through the posting templates"
            "entries:read": "Read entries the client posted or that touch its accounts"
            "corrections:write": "Reverse entries (operator)"
            "adjustments:request": "Request adjustments (operator, maker)"
            "adjustments:approve": "Approve or reject adjustments (operator, checker)"
            "holds:read": "Read holds"
            "holds:write": "Place, capture and release holds"
            "periods:read": "Read accounting periods"
            "periods:close": "Close accounting periods (operator)"
            "reports:read": "Read trial balances and ageing (operator)"
            "offline:write": "Offline devices, vouchers and receipts"
  parameters:
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      description: "Makes a write safe to retry. The same key with the same request returns the original result; with a different request, `409 idempotency_key_reused`. Keys are per client and kept for at least 30 days (ADR-0008)."
      schema:
        $ref: "#/components/schemas/IdempotencyKeyValue"
    Limit:
      name: "limit"
      in: "query"
      description: "Page size."
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: "cursor"
      in: "query"
      description: "An opaque cursor from `next_cursor`."
      schema:
        type: "string"
        maxLength: 512
  headers:
    Location:
      description: "The URL of the created resource."
      schema:
        type: "string"
    IdempotentReplayed:
      description: "`true` when the response repeats an earlier request with the same key."
      schema:
        type: "string"
        enum:
          - "true"
    RetryAfter:
      description: "Seconds to wait before retrying."
      schema:
        type: "integer"
        minimum: 1
  responses:
    EntryPosted:
      description: "The entry was posted."
      headers:
        Location:
          $ref: "#/components/headers/Location"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Entry"
          example:
            id: "0192f3c4-0000-7000-8000-000000000007"
            sequence: 8
            kind: "standard"
            template: "merchant_payment.v1"
            period_id: 12
            recorded_at: "2026-11-14T09:30:12.418205Z"
            event_time: null
            lines:
              - account: "0192f3c4-0000-7000-8000-000000000002"
                side: "debit"
                amount:
                  amount: "100.00"
                  currency: "ETB"
              - account: "0192f3c4-0000-7000-8000-000000000004"
                side: "credit"
                amount:
                  amount: "98.00"
                  currency: "ETB"
              - account: "0192f3c4-0000-7000-8000-000000000005"
                side: "credit"
                amount:
                  amount: "2.00"
                  currency: "ETB"
            metadata:
              template: "merchant_payment.v1"
              channel: "qr"
              order: "order-81"
            reverses: null
            refunds: null
            authorization: null
            receipt: null
    EntryReplayed:
      description: "A repeat of a request already posted with this idempotency key: the original entry, unchanged."
      headers:
        Idempotent-Replayed:
          $ref: "#/components/headers/IdempotentReplayed"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Entry"
    BadRequest:
      description: "The request is malformed"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalid_request:
              $ref: "#/components/examples/error-invalid_request"
            idempotency_key_required:
              $ref: "#/components/examples/error-idempotency_key_required"
    Unauthenticated:
      description: "Authentication is required"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unauthenticated:
              $ref: "#/components/examples/error-unauthenticated"
    Forbidden:
      description: "The token lacks the scope"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            forbidden:
              $ref: "#/components/examples/error-forbidden"
    NotFound:
      description: "Not found, or not visible to the caller"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            not_found:
              $ref: "#/components/examples/error-not_found"
    InternalError:
      description: "An internal error; the request may or may not have taken effect. Retry with the same Idempotency-Key, or look the entry up by its key"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            internal_error:
              $ref: "#/components/examples/error-internal_error"
            template_defect:
              $ref: "#/components/examples/error-template_defect"
    RateLimited:
      description: "Too many requests"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            rate_limited:
              $ref: "#/components/examples/error-rate_limited"
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    Unavailable:
      description: "Busy, in contention, or no period is open; safe to retry"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            busy:
              $ref: "#/components/examples/error-busy"
            contention:
              $ref: "#/components/examples/error-contention"
            no_open_period:
              $ref: "#/components/examples/error-no_open_period"
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
  schemas:
    Uuid7:
      type: "string"
      format: "uuid"
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: "A lowercase UUIDv7, generated by the ledger (ADR-0006)."
    AccountId:
      allOf:
        - $ref: "#/components/schemas/Uuid7"
      description: "An account ID."
    EntryId:
      allOf:
        - $ref: "#/components/schemas/Uuid7"
      description: "An entry ID."
    HoldId:
      allOf:
        - $ref: "#/components/schemas/Uuid7"
      description: "A hold ID."
    AdjustmentId:
      allOf:
        - $ref: "#/components/schemas/Uuid7"
      description: "An adjustment request ID."
    PeriodId:
      type: "integer"
      format: "int64"
      minimum: 1
    TemplateId:
      type: "string"
      pattern: "^[a-z][a-z0-9_]{0,63}\\.v[1-9][0-9]{0,4}$"
      examples:
        - "merchant_payment.v1"
    Reference:
      type: "string"
      pattern: "^[0-9]{4}(:[a-z]{2,8}-[a-z0-9-]{1,60})?$"
      description: "A chart reference: a system account (`1010`) or a sub-account (`2010:cust-abebe`)."
      examples:
        - "2010:cust-abebe"
    AccountRef:
      type: "string"
      description: "An account, by ID or by chart reference."
      oneOf:
        - $ref: "#/components/schemas/AccountId"
        - $ref: "#/components/schemas/Reference"
      examples:
        - "2010:cust-abebe"
    IdempotencyKeyValue:
      type: "string"
      pattern: "^[A-Za-z0-9._:-]{1,128}$"
      examples:
        - "pay-2026-11-14-0001"
    Currency:
      type: "string"
      pattern: "^[A-Z]{3}$"
      description: "An ISO 4217 code the ledger supports."
      examples:
        - "ETB"
    Money:
      type: "object"
      additionalProperties: false
      required:
        - "amount"
        - "currency"
      properties:
        amount:
          type: "string"
          pattern: "^-?(0|[1-9][0-9]{0,17})(\\.[0-9]{1,4})?$"
          description: "A decimal amount, with at most the currency's minor-unit digits (ETB: 2). Never a JSON number."
          examples:
            - "39.20"
        currency:
          $ref: "#/components/schemas/Currency"
      description: "An amount with its currency (ADR-0005, ADR-0009)."
    PositiveMoney:
      allOf:
        - $ref: "#/components/schemas/Money"
      description: "Greater than zero."
    NonNegativeMoney:
      allOf:
        - $ref: "#/components/schemas/Money"
      description: "Zero or more."
    Side:
      type: "string"
      enum:
        - "debit"
        - "credit"
    Metadata:
      type: "object"
      maxProperties: 32
      additionalProperties:
        type: "string"
        maxLength: 512
      propertyNames:
        pattern: "^[a-z][a-z0-9_]{0,63}$"
      description: "Client references, copied into the entry, never used for accounting. At most 32 keys and 4096 bytes in all. The key `template` is reserved."
    EventTime:
      type:
        - "string"
        - "null"
      format: "date-time"
      description: "When the event happened, if the client knows (an offline payment). Informational: the entry is posted now, into the open period (INV-12)."
    Account:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "reference"
        - "code"
        - "name"
        - "type"
        - "normal_side"
        - "currency"
        - "status"
        - "allow_negative"
        - "balance"
        - "debits_total"
        - "credits_total"
      properties:
        id:
          $ref: "#/components/schemas/AccountId"
        reference:
          $ref: "#/components/schemas/Reference"
        code:
          type: "integer"
        sub_account:
          type:
            - "string"
            - "null"
        name:
          type: "string"
        type:
          type: "string"
          enum:
            - "asset"
            - "liability"
            - "equity"
            - "revenue"
            - "expense"
        normal_side:
          $ref: "#/components/schemas/Side"
        currency:
          $ref: "#/components/schemas/Currency"
        status:
          type: "string"
          enum:
            - "open"
            - "frozen"
            - "closed"
        allow_negative:
          type: "boolean"
        balance:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: "On the normal side."
        debits_total:
          $ref: "#/components/schemas/Money"
        credits_total:
          $ref: "#/components/schemas/Money"
    AccountPage:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "next_cursor"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/Account"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    NextCursor:
      type:
        - "string"
        - "null"
      description: "Pass as `cursor` for the next page; `null` on the last page."
    OpenAccountRequest:
      type: "object"
      additionalProperties: false
      required:
        - "reference"
      properties:
        reference:
          $ref: "#/components/schemas/Reference"
    ChangeStatusRequest:
      type: "object"
      additionalProperties: false
      required:
        - "status"
        - "reason"
      properties:
        status:
          type: "string"
          enum:
            - "open"
            - "frozen"
            - "closed"
        reason:
          type: "string"
          pattern: "^[a-z0-9_]{1,64}$"
    Balance:
      type: "object"
      additionalProperties: false
      required:
        - "account"
        - "as_of"
        - "balance"
        - "debits_total"
        - "credits_total"
      properties:
        account:
          $ref: "#/components/schemas/AccountId"
        as_of:
          type: "string"
          format: "date-time"
        balance:
          $ref: "#/components/schemas/Money"
        debits_total:
          $ref: "#/components/schemas/Money"
        credits_total:
          $ref: "#/components/schemas/Money"
    LedgerLine:
      type: "object"
      additionalProperties: false
      required:
        - "entry"
        - "sequence"
        - "recorded_at"
        - "side"
        - "amount"
        - "balance"
      properties:
        entry:
          $ref: "#/components/schemas/EntryId"
        sequence:
          type: "integer"
          format: "int64"
        recorded_at:
          type: "string"
          format: "date-time"
        side:
          $ref: "#/components/schemas/Side"
        amount:
          $ref: "#/components/schemas/Money"
        balance:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: "After this line, on the normal side."
    LedgerPage:
      type: "object"
      additionalProperties: false
      required:
        - "account"
        - "opening_balance"
        - "items"
        - "next_cursor"
      properties:
        account:
          $ref: "#/components/schemas/AccountId"
        opening_balance:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: "Before the first line of this page."
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/LedgerLine"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    Template:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "roles"
        - "amounts"
        - "optional_amounts"
        - "metadata"
        - "refunds"
      properties:
        id:
          $ref: "#/components/schemas/TemplateId"
        roles:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "name"
              - "codes"
              - "optional"
            properties:
              name:
                type: "string"
              codes:
                type: "array"
                items:
                  type: "integer"
              optional:
                type: "boolean"
        amounts:
          type: "array"
          items:
            type: "string"
        optional_amounts:
          type: "array"
          items:
            type: "string"
        metadata:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "name"
              - "required"
              - "values"
            properties:
              name:
                type: "string"
              required:
                type: "boolean"
              values:
                type: "array"
                items:
                  type: "string"
        refunds:
          type: "boolean"
    EntryLine:
      type: "object"
      additionalProperties: false
      required:
        - "account"
        - "side"
        - "amount"
      properties:
        account:
          $ref: "#/components/schemas/AccountId"
        side:
          $ref: "#/components/schemas/Side"
        amount:
          $ref: "#/components/schemas/Money"
    Authorization:
      type:
        - "object"
        - "null"
      additionalProperties: false
      required:
        - "reason"
        - "requested_by"
      properties:
        reason:
          type: "string"
        requested_by:
          type: "string"
        approved_by:
          type:
            - "string"
            - "null"
    Entry:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "sequence"
        - "kind"
        - "template"
        - "period_id"
        - "recorded_at"
        - "event_time"
        - "lines"
        - "metadata"
        - "reverses"
        - "refunds"
        - "authorization"
        - "receipt"
      properties:
        id:
          $ref: "#/components/schemas/EntryId"
        sequence:
          type: "integer"
          format: "int64"
          description: "Posting order (INV-12)."
        kind:
          type: "string"
          enum:
            - "standard"
            - "reversal"
            - "adjustment"
            - "refund"
        template:
          oneOf:
            - $ref: "#/components/schemas/TemplateId"
            - type: "null"
          description: "The template that booked it; `null` for a reversal or an adjustment."
        period_id:
          $ref: "#/components/schemas/PeriodId"
        recorded_at:
          type: "string"
          format: "date-time"
        event_time:
          $ref: "#/components/schemas/EventTime"
        lines:
          type: "array"
          minItems: 2
          items:
            $ref: "#/components/schemas/EntryLine"
        metadata:
          type: "object"
          additionalProperties:
            type: "string"
        reverses:
          oneOf:
            - $ref: "#/components/schemas/EntryId"
            - type: "null"
        refunds:
          oneOf:
            - $ref: "#/components/schemas/EntryId"
            - type: "null"
        authorization:
          $ref: "#/components/schemas/Authorization"
        receipt:
          type:
            - "object"
            - "null"
          description: "The signed ledger receipt (spec §7.2). `null` until step 2.09."
    ReversalRequest:
      type: "object"
      additionalProperties: false
      required:
        - "reason"
      properties:
        reason:
          type: "string"
          enum:
            - "booking_error"
            - "duplicate_posting"
        note:
          type: "string"
          maxLength: 500
    AdjustmentLine:
      type: "object"
      additionalProperties: false
      required:
        - "account"
        - "side"
        - "amount"
      properties:
        account:
          $ref: "#/components/schemas/AccountRef"
        side:
          $ref: "#/components/schemas/Side"
        amount:
          $ref: "#/components/schemas/PositiveMoney"
    AdjustmentRequestInput:
      type: "object"
      additionalProperties: false
      required:
        - "reason"
        - "lines"
      properties:
        reason:
          type: "string"
          enum:
            - "goodwill_credit"
            - "compensation"
            - "bank_charge"
            - "write_off"
            - "data_migration"
        lines:
          type: "array"
          minItems: 2
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdjustmentLine"
        metadata:
          $ref: "#/components/schemas/Metadata"
        note:
          type: "string"
          maxLength: 500
    AdjustmentRequest:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "status"
        - "reason"
        - "lines"
        - "requested_by"
        - "requested_at"
      properties:
        id:
          $ref: "#/components/schemas/AdjustmentId"
        status:
          type: "string"
          enum:
            - "pending"
            - "approved"
            - "rejected"
        reason:
          type: "string"
        lines:
          type: "array"
          items:
            $ref: "#/components/schemas/EntryLine"
        metadata:
          type: "object"
          additionalProperties:
            type: "string"
        requested_by:
          type: "string"
        requested_at:
          type: "string"
          format: "date-time"
        decided_by:
          type:
            - "string"
            - "null"
        decided_at:
          type:
            - "string"
            - "null"
          format: "date-time"
        entry:
          oneOf:
            - $ref: "#/components/schemas/EntryId"
            - type: "null"
          description: "The posted adjustment, once approved."
    RejectionRequest:
      type: "object"
      additionalProperties: false
      required:
        - "note"
      properties:
        note:
          type: "string"
          minLength: 1
          maxLength: 500
    PlaceHoldRequest:
      type: "object"
      additionalProperties: false
      required:
        - "account"
        - "held_account"
        - "amount"
        - "expires_at"
      properties:
        account:
          $ref: "#/components/schemas/AccountRef"
        held_account:
          $ref: "#/components/schemas/AccountRef"
        amount:
          $ref: "#/components/schemas/PositiveMoney"
        expires_at:
          type: "string"
          format: "date-time"
    CaptureHoldRequest:
      type: "object"
      additionalProperties: false
      required:
        - "destination"
        - "amount"
      properties:
        destination:
          $ref: "#/components/schemas/AccountRef"
        amount:
          $ref: "#/components/schemas/PositiveMoney"
    Hold:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "account"
        - "held_account"
        - "amount"
        - "captured"
        - "status"
        - "expires_at"
        - "place_entry"
        - "close_entry"
      properties:
        id:
          $ref: "#/components/schemas/HoldId"
        account:
          $ref: "#/components/schemas/AccountId"
        held_account:
          $ref: "#/components/schemas/AccountId"
        amount:
          $ref: "#/components/schemas/Money"
        captured:
          $ref: "#/components/schemas/Money"
        status:
          type: "string"
          enum:
            - "active"
            - "captured"
            - "released"
            - "expired"
        expires_at:
          type: "string"
          format: "date-time"
        place_entry:
          $ref: "#/components/schemas/EntryId"
        close_entry:
          oneOf:
            - $ref: "#/components/schemas/EntryId"
            - type: "null"
    Period:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "label"
        - "status"
        - "opened_at"
        - "after_sequence"
        - "last_sequence"
        - "closing_at"
        - "closed_at"
      properties:
        id:
          $ref: "#/components/schemas/PeriodId"
        label:
          type: "string"
          pattern: "^[A-Za-z0-9._:-]{1,64}$"
        status:
          type: "string"
          enum:
            - "open"
            - "closing"
            - "closed"
        opened_at:
          type: "string"
          format: "date-time"
        after_sequence:
          type: "integer"
          format: "int64"
        last_sequence:
          type:
            - "integer"
            - "null"
          format: "int64"
        closing_at:
          type:
            - "string"
            - "null"
          format: "date-time"
        closed_at:
          type:
            - "string"
            - "null"
          format: "date-time"
    PeriodPage:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "next_cursor"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/Period"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    ClosePeriodRequest:
      type: "object"
      additionalProperties: false
      required:
        - "next_label"
      properties:
        next_label:
          type: "string"
          pattern: "^[A-Za-z0-9._:-]{1,64}$"
    CloseReport:
      type: "object"
      additionalProperties: false
      required:
        - "period"
        - "next"
        - "entries"
        - "snapshots"
      properties:
        period:
          $ref: "#/components/schemas/Period"
        next:
          $ref: "#/components/schemas/Period"
        entries:
          type: "integer"
        snapshots:
          type: "integer"
    TrialBalanceRow:
      type: "object"
      additionalProperties: false
      required:
        - "account"
        - "reference"
        - "type"
        - "debits_total"
        - "credits_total"
        - "debit_balance"
        - "credit_balance"
      properties:
        account:
          $ref: "#/components/schemas/AccountId"
        reference:
          $ref: "#/components/schemas/Reference"
        type:
          type: "string"
          enum:
            - "asset"
            - "liability"
            - "equity"
            - "revenue"
            - "expense"
        debits_total:
          $ref: "#/components/schemas/Money"
        credits_total:
          $ref: "#/components/schemas/Money"
        debit_balance:
          $ref: "#/components/schemas/Money"
        credit_balance:
          $ref: "#/components/schemas/Money"
    TrialBalance:
      type: "object"
      additionalProperties: false
      required:
        - "as_of"
        - "rows"
        - "totals"
        - "balanced"
      properties:
        as_of:
          type: "object"
          additionalProperties: false
          properties:
            period_id:
              oneOf:
                - $ref: "#/components/schemas/PeriodId"
                - type: "null"
            time:
              type:
                - "string"
                - "null"
              format: "date-time"
        rows:
          type: "array"
          items:
            $ref: "#/components/schemas/TrialBalanceRow"
        totals:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "debit_balances"
              - "credit_balances"
            properties:
              debit_balances:
                $ref: "#/components/schemas/Money"
              credit_balances:
                $ref: "#/components/schemas/Money"
        balanced:
          type: "boolean"
          description: "Debit balances equal credit balances in every currency (INV-2)."
    OpenItem:
      type: "object"
      additionalProperties: false
      required:
        - "account"
        - "reference"
        - "balance"
        - "since"
        - "age_seconds"
      properties:
        account:
          $ref: "#/components/schemas/AccountId"
        reference:
          $ref: "#/components/schemas/Reference"
        balance:
          $ref: "#/components/schemas/Money"
        since:
          type: "string"
          format: "date-time"
        age_seconds:
          type: "integer"
          minimum: 0
    OfflineDeviceRequest:
      type: "object"
      description: "Designed in step 2.10."
    OfflineVoucherRequest:
      type: "object"
      description: "Designed in step 2.10."
    OfflineReceiptsRequest:
      type: "object"
      description: "Designed in step 2.10."
    ErrorCode:
      type: "string"
      enum:
        - "invalid_request"
        - "idempotency_key_required"
        - "unauthenticated"
        - "forbidden"
        - "not_found"
        - "idempotency_key_reused"
        - "rate_limited"
        - "internal_error"
        - "not_implemented"
        - "busy"
        - "contention"
        - "no_open_period"
        - "too_few_lines"
        - "too_many_lines"
        - "metadata_too_large"
        - "amount_not_positive"
        - "account_not_found"
        - "account_not_open"
        - "currency_mismatch"
        - "duplicate_line"
        - "amount_overflow"
        - "unbalanced"
        - "account_total_overflow"
        - "insufficient_funds"
        - "invalid_template_id"
        - "unknown_template"
        - "unknown_template_version"
        - "missing_amount"
        - "unexpected_amount"
        - "non_positive_amount"
        - "missing_account"
        - "unexpected_account"
        - "bound_account_not_found"
        - "account_not_allowed"
        - "same_account"
        - "reserved_metadata"
        - "template_defect"
        - "amount_not_whole_balance"
        - "account_not_new"
        - "fee_exceeds_amount"
        - "amount_currency_mismatch"
        - "amount_too_large"
        - "missing_metadata"
        - "invalid_metadata"
        - "missing_refunded_entry"
        - "unexpected_refunded_entry"
        - "invalid_reference"
        - "duplicate_reference"
        - "invalid_status_change"
        - "already_reversed"
