$kind: http-request
description: "The payer repays a shortfall from their wallet to the loss account (E30). The wallet must hold the amount; repaying a repaid shortfall returns it unchanged."
url: "{{baseUrl}}/v1/offline/shortfalls/:shortfall_id/repay"
method: POST
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: shortfall_id
    value: 0192f3c4-0000-7000-8000-000000000f01
    disabled: false
    description: (Required) The shortfall.
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /oauth/token
    scope: accounts:read accounts:read_all accounts:write accounts:admin operations:write entries:read corrections:write adjustments:request adjustments:approve holds:read holds:write periods:read periods:close reports:read offline:write
    grant_type: client_credentials
settings: {}
examples: ./.resources/Repay a shortfall.resources/examples
order: 5100
