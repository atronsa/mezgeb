$kind: http-example
name: "The voucher."
request:
  url: "{{baseUrl}}/v1/offline/vouchers/:voucher_id"
  method: GET
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/json
  pathVariables:
    - key: voucher_id
      value: 0192f3c4-0000-7000-8000-000000000e01
      disabled: false
      description: (Required) The voucher.
  body:
    type: text
    content: ""
