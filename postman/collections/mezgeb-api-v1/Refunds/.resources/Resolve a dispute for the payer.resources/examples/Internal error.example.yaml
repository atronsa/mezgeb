$kind: http-example
request:
  url: "{{baseUrl}}/v1/operations/dispute_resolve_payer.v1"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Idempotency-Key
      value: pay-2026-11-14-0001
      disabled: false
      description: (Required) Makes a write safe to retry. The same key with the same request returns the original result; with a different request, `409 idempotency_key_reused`. Keys are per client and kept for at least 30 days (ADR-0008).
    - key: Accept
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "accounts": {
          "dispute_item": "2060:dsp-0001",
          "payer_wallet": "2010:cust-abebe"
        },
        "amounts": {
          "amount": {
            "amount": "100.00",
            "currency": "ETB"
          }
        },
        "refunds": "0192f3c4-0000-7000-8000-000000000009"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:internal_error",
        "title": "Internal error",
        "status": 500,
        "code": "internal_error",
        "detail": "Internal error.",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 9000
