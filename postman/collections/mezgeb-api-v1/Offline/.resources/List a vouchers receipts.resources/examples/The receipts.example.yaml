$kind: http-example
name: "The receipts"
request:
  url: "{{baseUrl}}/v1/offline/vouchers/:voucher_id/receipts"
  method: GET
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/json
  pathVariables:
    - key: voucher_id
      value: 0192f3c4-0000-7000-8000-000000000e01
      disabled: false
      description: (Required) The voucher.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "items": [
          {
            "device": "0192f3c4-0000-7000-8000-000000000d01",
            "counter": 1,
            "voucher": "0192f3c4-0000-7000-8000-000000000e01",
            "digest": "e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3e3",
            "payee": "0192f3c4-0000-7000-8000-000000000003",
            "amount": {
              "amount": "60.00",
              "currency": "ETB"
            },
            "event_time": "2026-11-16T01:00:00Z",
            "outcome": "SETTLED",
            "entry": "0192f3c4-0000-7000-8000-000000000e11"
          }
        ]
      }
order: 1000
