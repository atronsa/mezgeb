$kind: http-request
description: "The public keys that sign receipts and checkpoints, by key ID. Retired keys stay listed, so old signatures remain verifiable."
url: "{{baseUrl}}/v1/keys"
method: GET
headers:
  Accept: application/json
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /oauth/token
    scope: accounts:read accounts:read_all accounts:write accounts:admin operations:write entries:read corrections:write adjustments:request adjustments:approve holds:read holds:write periods:read periods:close reports:read offline:write audit:read
    grant_type: client_credentials
settings: {}
examples: ./.resources/List the signing keys.resources/examples
order: 1000
