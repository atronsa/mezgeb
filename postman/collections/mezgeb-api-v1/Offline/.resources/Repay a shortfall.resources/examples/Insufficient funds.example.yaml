$kind: http-example
request:
  url: "{{baseUrl}}/v1/offline/shortfalls/:shortfall_id/repay"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/problem+json
  pathVariables:
    - key: shortfall_id
      value: 0192f3c4-0000-7000-8000-000000000f01
      disabled: false
      description: (Required) The shortfall.
  body:
    type: text
    content: ""
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:insufficient_funds",
        "title": "An account would go below zero",
        "status": 422,
        "code": "insufficient_funds",
        "detail": "the wallet does not hold the shortfall",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 5500
