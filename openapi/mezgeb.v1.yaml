  /v1/offline/vouchers:
    post:
      operationId: "issueVoucher"
      tags:
        - "Offline"
      summary: "Issue an offline voucher"
      description: "Reserves an offline allowance for an active device: posts E16 (`issue_voucher.v1`), moving the amount from the owner's wallet into the voucher's own escrow `2050:vch-<id>`, and signs the voucher with the issuer key (protocol §7). One open voucher per device; the amount is at most the tier's limit, and the owner's open vouchers at most 5,000 ETB. The voucher's `counter_start` is after the device's reported `last_counter` and after every counter the ledger has recorded for it, so a receipt of an earlier voucher still in transit never collides with it. A repeat with the same Idempotency-Key returns the same voucher."
      security:
        - oauth2:
            - "offline:write"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfflineVoucherRequest"
            example:
              device: "0192f3c4-0000-7000-8000-000000000d01"
              amount:
                amount: "100.00"
                currency: "ETB"
              last_counter: 0
      responses:
        "200":
          description: "The voucher, issued earlier for this Idempotency-Key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"
        "201":
          description: "The signed voucher."
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Voucher"
              example:
                id: "0192f3c4-0000-7000-8000-000000000e01"
                device: "0192f3c4-0000-7000-8000-000000000d01"
                owner_account: "0192f3c4-0000-7000-8000-000000000002"
                escrow_account: "0192f3c4-0000-7000-8000-000000000e02"
                amount:
                  amount: "100.00"
                  currency: "ETB"
                counter_start: 1
                issued_at: "2026-11-16T00:00:00Z"
                expires_at: "2026-11-17T00:00:00Z"
                status: "active"
                entry: "0192f3c4-0000-7000-8000-000000000e03"
                issuer_key_id: "8356ab979cb1fbd8"
                body: "6d657a6765622e6f66666c696e652e766f75636865722e763100"
                signature: "cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "The device cannot get a voucher now"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                device_not_active:
                  $ref: "#/components/examples/error-device_not_active"
                certificate_expired:
                  $ref: "#/components/examples/error-certificate_expired"
                voucher_open:
                  $ref: "#/components/examples/error-voucher_open"
                shortfall_unpaid:
                  $ref: "#/components/examples/error-shortfall_unpaid"
                idempotency_key_reused:
                  $ref: "#/components/examples/error-idempotency_key_reused"
        "422":
          description: "The voucher was refused"
