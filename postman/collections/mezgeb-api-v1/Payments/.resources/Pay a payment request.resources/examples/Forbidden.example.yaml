$kind: http-example
request:
  url: "{{baseUrl}}/v1/operations/payment_request_settle.v1"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Idempotency-Key
      value: pay-2026-11-14-0001
      disabled: false
      description: (Required) Makes a write safe to retry. The same key with the same request returns the original result; with a different request, `409 idempotency_key_reused`. Keys are per client and kept for at least 30 days (ADR-0008).
    - key: Accept
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "accounts": {
          "payer_wallet": "2010:cust-abebe",
          "payee": "2010:cust-hana",
          "fee_revenue": "4010"
        },
        "amounts": {
          "amount": {
            "amount": "100.00",
            "currency": "ETB"
          }
        },
        "metadata": {
          "payment_request": "req-0001"
        }
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:forbidden",
        "title": "The caller may not do this",
        "status": 403,
        "code": "forbidden",
        "detail": "The caller may not do this.",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 5000
