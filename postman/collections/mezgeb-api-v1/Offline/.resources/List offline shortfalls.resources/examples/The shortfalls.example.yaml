$kind: http-example
name: "The shortfalls"
request:
  url: "{{baseUrl}}/v1/offline/shortfalls"
  method: GET
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
