$kind: http-example
name: The account.
request:
  url: "{{baseUrl}}/v1/accounts/:account_id"
  method: GET
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/json
  pathVariables:
    - key: account_id
      value: db42271e-18fb-74c3-be54-32899ef41292
      disabled: false
      description: (Required) The account.
  body:
    type: text
    content: ""
