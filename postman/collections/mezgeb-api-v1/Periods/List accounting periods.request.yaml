$kind: http-request
description: Every period, newest first.
url: "{{baseUrl}}/v1/periods?limit=50&cursor=string"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: limit
    value: "50"
    disabled: false
    description: Page size.
  - key: cursor
    value: string
    disabled: false
    description: An opaque cursor from `next_cursor`.
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /oauth/token
    scope: accounts:read accounts:read_all accounts:write accounts:admin operations:write entries:read corrections:write adjustments:request adjustments:approve holds:read holds:write periods:read periods:close reports:read offline:write
    grant_type: client_credentials
settings: {}
examples: ./.resources/List accounting periods.resources/examples
order: 1000
