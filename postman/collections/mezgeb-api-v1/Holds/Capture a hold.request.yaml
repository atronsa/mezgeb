$kind: http-request
description: Moves the captured amount to the destination and returns the rest to the account, in one entry (INV-17).
url: "{{baseUrl}}/v1/holds/:hold_id/capture"
method: POST
headers:
  - key: Idempotency-Key
    value: pay-2026-11-14-0001
    disabled: false
    description: (Required) Makes a write safe to retry. The same key with the same request returns the original result; with a different request, `409 idempotency_key_reused`. Keys are per client and kept for at least 30 days (ADR-0008).
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: hold_id
    value: df1b2b83-8b54-739e-852e-21a0f85d0007
    disabled: false
    description: (Required) The hold.
body:
  type: json
  content: |-
    {
      "destination": "2030:merch-coffee",
      "amount": {
        "amount": "250.00",
        "currency": "ETB"
      }
    }
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /oauth/token
    scope: accounts:read accounts:read_all accounts:write accounts:admin operations:write entries:read corrections:write adjustments:request adjustments:approve holds:read holds:write periods:read periods:close reports:read offline:write
    grant_type: client_credentials
settings: {}
examples: ./.resources/Capture a hold.resources/examples
order: 3000
