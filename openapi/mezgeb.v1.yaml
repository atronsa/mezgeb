  /v1/offline/devices:
    post:
      operationId: "registerDevice"
      tags:
        - "Offline"
      summary: "Register an offline device"
      description: "Registers a payer device's P-256 public key for a customer wallet and returns its device certificate, signed by the issuer key (protocol §5). The attestation decides the tier: until a card chip is chosen and Android Key Attestation is verified, only `none` is accepted, which earns tier C if the client has enabled it. The public key identifies the request: registering it again with the same details returns the device (`200`, `Idempotent-Replayed: true`)."
      security:
        - oauth2:
            - "offline:write"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfflineDeviceRequest"
            example:
              owner_account: "2010:cust-hana"
              public_key: "03ca16e9076330c0c89ff8738477b10113a8d324b21e95863ef1f442035b1203c1"
              label: "Hana's phone"
              attestation:
                type: "none"
      responses:
        "200":
          description: "The device, registered earlier with the same details."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "201":
          description: "The device and its certificate."
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
              example:
                id: "0192f3c4-0000-7000-8000-000000000d01"
                owner_account: "0192f3c4-0000-7000-8000-000000000002"
                public_key: "03ca16e9076330c0c89ff8738477b10113a8d324b21e95863ef1f442035b1203c1"
                key_id: "a2bfef699d293e97"
                tier: "C"
                attestation: "none"
                label: "Hana's phone"
                status: "active"
                status_reason: null
                next_counter: 1
                certificate:
                  body: "6d657a6765622e6f66666c696e652e6465766963652e763100"
                  signature: "abababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababab"
                  issuer_key_id: "8356ab979cb1fbd8"
                  issued_at: "2026-11-16T00:00:00Z"
                  valid_until: "2027-11-16T00:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "The key is registered with other details"
