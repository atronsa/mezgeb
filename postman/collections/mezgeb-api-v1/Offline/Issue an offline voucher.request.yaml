$kind: http-request
description: "Reserves an offline allowance for an active device: posts E16 (`issue_voucher.v1`) into the voucher's own escrow and signs the voucher with the issuer key (protocol §7). One open voucher per device; at most the tier's limit, and 5,000 ETB of open vouchers per customer. Send the device's `last_counter` (0 if it never signed a receipt): the voucher starts after it and after every counter the ledger has recorded."
url: "{{baseUrl}}/v1/offline/vouchers"
method: POST
headers:
  - key: Idempotency-Key
    value: offline-0001
    disabled: false
    description: (Required) Makes a write safe to retry. The same key with the same request returns the original result; with a different request, `409 idempotency_key_reused`. Keys are per client and kept for at least 30 days (ADR-0008).
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "device": "0192f3c4-0000-7000-8000-000000000d01",
      "amount": {
        "amount": "100.00",
        "currency": "ETB"
      },
      "last_counter": 0
    }
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /oauth/token
    scope: accounts:read accounts:read_all accounts:write accounts:admin operations:write entries:read corrections:write adjustments:request adjustments:approve holds:read holds:write periods:read periods:close reports:read offline:write
    grant_type: client_credentials
settings: {}
examples: ./.resources/Issue an offline voucher.resources/examples
order: 2000
