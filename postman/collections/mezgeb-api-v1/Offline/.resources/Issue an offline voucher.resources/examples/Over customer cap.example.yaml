$kind: http-example
request:
  url: "{{baseUrl}}/v1/offline/vouchers"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Idempotency-Key
      value: offline-0001
      disabled: false
      description: (Required) Makes a write safe to retry. The same key with the same request returns the original result; with a different request, `409 idempotency_key_reused`. Keys are per client and kept for at least 30 days (ADR-0008).
    - key: Accept
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "device": "0192f3c4-0000-7000-8000-000000000d01",
        "amount": {
          "amount": "100.00",
          "currency": "ETB"
        },
        "last_counter": 0
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:over_customer_cap",
        "title": "The customer's open vouchers would exceed the cap",
        "status": 422,
        "code": "over_customer_cap",
        "detail": "the customer has 400000 minor units in open vouchers; the cap is 500000",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 6100
