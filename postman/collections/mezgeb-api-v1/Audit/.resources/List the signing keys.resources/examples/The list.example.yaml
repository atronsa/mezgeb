$kind: http-example
request:
  url: "{{baseUrl}}/v1/keys"
  method: GET
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "items": [
          {
            "key_id": "ff5ede75cdea72c4",
            "algorithm": "Ed25519",
            "public_key": "3b6a27bcceb6a42d62a3a8d02a6f0d73653215771de243a63ac048a18b59da29"
          }
        ]
      }
order: 1000
