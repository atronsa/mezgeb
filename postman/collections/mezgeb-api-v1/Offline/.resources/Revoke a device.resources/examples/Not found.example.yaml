$kind: http-example
request:
  url: "{{baseUrl}}/v1/offline/devices/:device_id/revoke"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/problem+json
  pathVariables:
    - key: device_id
      value: 0192f3c4-0000-7000-8000-000000000d01
      disabled: false
      description: (Required) The device.
  body:
    type: json
    content: |-
      {
        "reason": "replaced"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:not_found",
        "title": "Not found",
        "status": 404,
        "code": "not_found",
        "detail": "Not found.",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 5000
