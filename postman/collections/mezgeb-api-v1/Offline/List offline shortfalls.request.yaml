$kind: http-request
description: "What late receipts' payers could not pay, paid by the loss account 5030, oldest first. Until a payer repays theirs, none of their devices gets a voucher."
url: "{{baseUrl}}/v1/offline/shortfalls"
method: GET
headers:
  - key: Accept
    value: application/json
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /oauth/token
    scope: accounts:read accounts:read_all accounts:write accounts:admin operations:write entries:read corrections:write adjustments:request adjustments:approve holds:read holds:write periods:read periods:close reports:read offline:write
    grant_type: client_credentials
settings: {}
examples: ./.resources/List offline shortfalls.resources/examples
order: 5000
