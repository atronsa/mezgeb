[package]
name = "mezgeb-engine"
description = "Posting engine: writes balanced entries, holds and reversals to PostgreSQL."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mezgeb-core.workspace = true
sqlx.workspace = true
serde_json.workspace = true
# v7: the expiry worker mints the IDs of the entries it posts.
uuid = { workspace = true, features = ["v7"] }
tokio.workspace = true

[features]
# Failure-injection hooks for tests only. Never enable in a build that runs
# against real money.
test-hooks = []

[dev-dependencies]
mezgeb-engine = { path = ".", features = ["test-hooks"] }
tokio.workspace = true
proptest.workspace = true
uuid.workspace = true

[lints]
workspace = true
