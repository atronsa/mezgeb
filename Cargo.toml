[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
mezgeb-core = { path = "crates/core" }
mezgeb-engine = { path = "crates/engine" }
mezgeb-ops = { path = "crates/ops" }
mezgeb-offline = { path = "crates/offline" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }
serde_json = "1"
toml = "0.9"
proptest = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
