$kind: http-example
name: The hold.
request:
  url: "{{baseUrl}}/v1/holds"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Idempotency-Key
      value: pay-2026-11-14-0001
      disabled: false
      description: (Required) Makes a write safe to retry. The same key with the same request returns the original result; with a different request, `409 idempotency_key_reused`. Keys are per client and kept for at least 30 days (ADR-0008).
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "account": "2010:cust-abebe",
        "held_account": "2010:cust-abebe-hold-0001",
        "amount": {
          "amount": "300.00",
          "currency": "ETB"
        },
        "expires_at": "2026-11-15T09:00:00Z"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "0192f3c4-0000-7000-9000-000000000001",
        "account": "0192f3c4-0000-7000-8000-000000000002",
        "held_account": "0192f3c4-0000-7000-8000-00000000000a",
        "amount": {
          "amount": "300.00",
          "currency": "ETB"
        },
        "captured": {
          "amount": "0.00",
          "currency": "ETB"
        },
        "status": "active",
        "expires_at": "2026-11-15T09:00:00Z",
        "place_entry": "0192f3c4-0000-7000-8000-000000000011",
        "close_entry": null
      }
order: 2000
