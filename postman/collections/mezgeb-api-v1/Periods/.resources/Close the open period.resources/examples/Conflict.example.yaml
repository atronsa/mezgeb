$kind: http-example
request:
  url: "{{baseUrl}}/v1/periods/close"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "next_label": "2026-11-15"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:period_label_taken",
        "title": "A period with this label exists",
        "status": 409,
        "code": "period_label_taken",
        "detail": "A period with this label exists.",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 5000
