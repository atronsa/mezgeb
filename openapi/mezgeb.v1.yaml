      description: "The signed checkpoints, oldest first: the heads of the entry and audit chains at each period's close. Keep copies: a checkpoint held outside the ledger is what proves its history was not rewritten (ADR-0018). `line` is the text form `mezgeb-cli verify --chain --checkpoints` reads."
      security:
