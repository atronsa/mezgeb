$kind: http-example
request:
  url: "{{baseUrl}}/v1/offline/devices"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "owner_account": "2010:cust-hana",
        "public_key": "03ca16e9076330c0c89ff8738477b10113a8d324b21e95863ef1f442035b1203c1",
        "label": "Hana's phone",
        "attestation": {
          "type": "none"
        }
      }
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:offline_unavailable",
        "title": "Offline payments are not configured",
        "status": 503,
        "code": "offline_unavailable",
        "detail": "This ledger has no offline issuer key, so offline payments are off.",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 9000
