$kind: http-example
request:
  url: "{{baseUrl}}/v1/reconciliation/breaks/:break_id/explain"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/problem+json
  pathVariables:
    - key: break_id
      value: 5cae026c-278e-7ac0-b56f-144db7afb1b8
      disabled: false
      description: (Required) The break.
  body:
    type: json
    content: |-
      {
        "reason": "The bank corrected its export; the first copy is right."
      }
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    - key: Retry-After
      value: "1909"
      disabled: false
      description: Seconds to wait before retrying.
    - key: Content-Type
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:busy",
        "title": "The accounts are busy; retry later",
        "status": 503,
        "code": "busy",
        "detail": "An account stayed locked longer than the lock timeout. Retry after the Retry-After interval.",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 9000
