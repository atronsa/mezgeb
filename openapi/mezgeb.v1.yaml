# Mezgeb Ledger API, v1-draft (step 2.06). The contract the API is built
# against in step 2.07; docs/api/README.md explains the conventions, and
# docs/api/errors.md the error catalogue.
openapi: "3.1.0"
info:
  title: "Mezgeb Ledger API"
  version: "1.0.0-draft"
  summary: "A double-entry ledger: accounts, posting templates, corrections, holds, periods and reports."
  description: |-
    The public API of the Mezgeb ledger (ADR-0009). Status: **v1-draft**, frozen for implementation in step 2.07.

    Conventions (docs/api/README.md):

    - Amounts are decimal strings with a currency, `{"amount": "39.20", "currency": "ETB"}`, never JSON numbers.
    - Every write that posts an entry or places a hold takes an `Idempotency-Key` header.
    - Errors are RFC 9457 Problem Details (`application/problem+json`) with a stable `code`; the catalogue is docs/api/errors.md.
    - Lists are cursor-paginated: `limit` and `cursor`, answered with `next_cursor`.
    - Times are RFC 3339 with microseconds, in UTC.
    - Clients post only through posting templates, one endpoint each. The only endpoint that takes arbitrary lines is the operator-only, maker-checker adjustment.
  contact:
    name: "Mezgeb maintainers"
  license:
    name: "Apache-2.0"
    identifier: "Apache-2.0"
servers:
  - url: "http://localhost:8080"
    description: "A local ledger (step 2.07)."
security:
  - oauth2: []
tags:
  - name: "Accounts"
    description: "Accounts, balances and history."
  - name: "Templates"
    description: "The posting templates this ledger accepts."
  - name: "Payments"
    description: "Transfers, merchant payments and payment requests (ADR-0014)."
  - name: "Deposits and withdrawals"
    description: "Money entering and leaving, clearing and suspense."
  - name: "Refunds and disputes"
    description: "Refunds capped by the original, and disputes (ADR-0015)."
  - name: "Entries"
    description: "Reading posted entries."
  - name: "Corrections"
    description: "Reversals, and maker-checker adjustments (operator only)."
  - name: "Holds"
    description: "Reserving money now, capturing or releasing it later (ADR-0004)."
  - name: "Periods"
    description: "Accounting periods and the close (ADR-0016)."
  - name: "Reports"
    description: "Trial balance and ageing."
  - name: "Offline"
    description: "Offline payments. Planned (steps 2.10–2.12)."
paths:
  /v1/accounts:
    post:
      operationId: "openAccount"
      tags:
        - "Accounts"
      summary: "Open an account"
      description: "Opens an account for a chart reference, such as `2010:cust-abebe` for a customer wallet. The caller owns the accounts it opens. System accounts (such as `1010`) are opened by the operator."
      security:
        - oauth2:
            - "accounts:write"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAccountRequest"
            example:
              reference: "2010:cust-abebe"
      responses:
        "201":
          description: "The account was opened."
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
              example:
                id: "0192f3c4-0000-7000-8000-000000000002"
                reference: "2010:cust-abebe"
                code: 2010
                sub_account: "cust-abebe"
                name: "Customer wallets"
                type: "liability"
                normal_side: "credit"
                currency: "ETB"
                status: "open"
                allow_negative: false
                balance:
                  amount: "0.00"
                  currency: "ETB"
                debits_total:
                  amount: "0.00"
                  currency: "ETB"
                credits_total:
                  amount: "0.00"
                  currency: "ETB"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "An account already exists for this reference, or the idempotency key was reused"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                duplicate_reference:
                  $ref: "#/components/examples/error-duplicate_reference"
                idempotency_key_reused:
                  $ref: "#/components/examples/error-idempotency_key_reused"
        "422":
          description: "The reference is invalid"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                invalid_reference:
                  $ref: "#/components/examples/error-invalid_reference"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: "listAccounts"
      tags:
        - "Accounts"
      summary: "List or find accounts"
      description: "Lists the accounts the caller owns, oldest first, or finds one by its chart reference. An operator token with `accounts:read_all` sees every account."
      security:
        - oauth2:
            - "accounts:read"
      responses:
        "200":
          description: "A page of accounts."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: "reference"
          in: "query"
          description: "Find the account with this chart reference."
          schema:
            $ref: "#/components/schemas/Reference"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
  /v1/accounts/{account_id}:
    get:
      operationId: "getAccount"
      tags:
        - "Accounts"
      summary: "Get an account"
      description: "The account, with its balance and totals as stored now."
      security:
        - oauth2:
            - "accounts:read"
      responses:
        "200":
          description: "The account."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
              example:
                id: "0192f3c4-0000-7000-8000-000000000002"
                reference: "2010:cust-abebe"
                code: 2010
                sub_account: "cust-abebe"
                name: "Customer wallets"
                type: "liability"
                normal_side: "credit"
                currency: "ETB"
                status: "open"
                allow_negative: false
                balance:
                  amount: "720.00"
                  currency: "ETB"
                debits_total:
                  amount: "1530.00"
                  currency: "ETB"
                credits_total:
                  amount: "2250.00"
                  currency: "ETB"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: "account_id"
          in: "path"
          required: true
          description: "The account."
          schema:
            $ref: "#/components/schemas/AccountId"
  /v1/accounts/{account_id}/balance:
    get:
      operationId: "getAccountBalance"
      tags:
        - "Accounts"
      summary: "Get the balance at a point in time"
      description: "The balance from every entry recorded at or before `as_of` (the posting time, not the event time). Without `as_of`, the balance now."
      security:
        - oauth2:
            - "accounts:read"
      responses:
        "200":
          description: "The balance."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
              example:
                account: "0192f3c4-0000-7000-8000-000000000002"
                as_of: "2026-11-14T00:00:00Z"
                balance:
                  amount: "470.00"
                  currency: "ETB"
                debits_total:
                  amount: "1000.00"
                  currency: "ETB"
                credits_total:
                  amount: "1470.00"
                  currency: "ETB"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: "account_id"
          in: "path"
          required: true
          description: "The account."
          schema:
            $ref: "#/components/schemas/AccountId"
        - name: "as_of"
          in: "query"
          description: "An RFC 3339 time."
          example: "2026-11-14T00:00:00Z"
          schema:
            type: "string"
            format: "date-time"
  /v1/accounts/{account_id}/ledger:
    get:
      operationId: "getAccountLedger"
      tags:
        - "Accounts"
      summary: "Get the account history (general ledger)"
      description: "Every line of the account from `from` (inclusive) to `to` (exclusive), by posting time, in posting order, with the balance after each line. The first page carries the opening balance; pages continue with `cursor`."
      security:
        - oauth2:
            - "accounts:read"
      responses:
        "200":
          description: "A page of the account history."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: "account_id"
          in: "path"
          required: true
          description: "The account."
          schema:
            $ref: "#/components/schemas/AccountId"
        - name: "from"
          in: "query"
          required: true
          description: "Start, RFC 3339, inclusive."
          example: "2026-11-01T00:00:00Z"
          schema:
            type: "string"
            format: "date-time"
        - name: "to"
          in: "query"
          required: true
          description: "End, RFC 3339, exclusive."
          example: "2026-12-01T00:00:00Z"
          schema:
            type: "string"
            format: "date-time"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
  /v1/accounts/{account_id}/status:
    post:
      operationId: "changeAccountStatus"
      tags:
        - "Accounts"
      summary: "Freeze, unfreeze or close an account"
      description: "Changes the account status: `open`, `frozen` (no postings), or `closed` (only at a zero balance; final). Operator only."
      security:
        - oauth2:
            - "accounts:admin"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: "account_id"
          in: "path"
          required: true
          description: "The account."
          schema:
            $ref: "#/components/schemas/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeStatusRequest"
            example:
              status: "frozen"
              reason: "fraud_review"
      responses:
        "200":
          description: "The account, with its new status."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "The status change is not allowed"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                invalid_status_change:
                  $ref: "#/components/examples/error-invalid_status_change"
                idempotency_key_reused:
                  $ref: "#/components/examples/error-idempotency_key_reused"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/templates:
    get:
      operationId: "listTemplates"
      tags:
        - "Templates"
      summary: "List the posting templates"
      description: "Every template version this ledger accepts, with its roles, amounts and metadata. A released version never changes."
      security:
        - oauth2:
            - "operations:write"
      responses:
        "200":
          description: "The templates."
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/templates/{template_id}:
    get:
      operationId: "getTemplate"
      tags:
        - "Templates"
      summary: "Get a posting template"
      description: "One template version, such as `merchant_payment.v1`."
      security:
        - oauth2:
            - "operations:write"
      responses:
        "200":
          description: "The template."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
              example:
                id: "merchant_payment.v1"
                roles:
                  - name: "payer_wallet"
                    codes:
                      - 2010
                    optional: false
                  - name: "merchant_balance"
                    codes:
                      - 2030
                    optional: false
                  - name: "fee_revenue"
                    codes:
                      - 4010
                    optional: true
                amounts:
                  - "amount"
                optional_amounts:
                  - "merchant_fee"
                  - "payer_fee"
                metadata:
                  - name: "channel"
                    required: true
                    values:
                      - "qr"
                      - "card_tap"
                      - "phone_tap"
                      - "fingerprint"
                refunds: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "No such template or version, or a malformed template ID"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                not_found:
                  $ref: "#/components/examples/error-not_found"
                invalid_template_id:
                  $ref: "#/components/examples/error-invalid_template_id"
                unknown_template:
                  $ref: "#/components/examples/error-unknown_template"
                unknown_template_version:
                  $ref: "#/components/examples/error-unknown_template_version"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
      parameters:
        - name: "template_id"
          in: "path"
          required: true
          description: "The template, as `name.vN`."
          schema:
            $ref: "#/components/schemas/TemplateId"
  /v1/operations/p2p_transfer.v1:
    post:
      operationId: "postP2pTransferV1"
      tags:
        - "Payments"
      summary: "Send money from one customer to another"
      description: "Books `p2p_transfer.v1` (worked entries E06). The request binds each role to an account and gives each amount; the template turns it into one balanced entry, which the ledger posts in one transaction. The client decides whether the operation is allowed (ADR-0002); the ledger decides how it is booked."
      x-mezgeb-template: {"id": "p2p_transfer.v1", "roles": ["payer_wallet", "payee_wallet"], "optional_roles": [], "amounts": ["amount"], "optional_amounts": [], "metadata": [], "refunds": false}
      security:
        - oauth2:
            - "operations:write"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/P2pTransferV1Request"
            example:
              accounts:
                payer_wallet: "2010:cust-abebe"
                payee_wallet: "2010:cust-hana"
              amounts:
                amount:
                  amount: "100.00"
                  currency: "ETB"
      responses:
        "201":
          $ref: "#/components/responses/EntryPosted"
        "200":
          $ref: "#/components/responses/EntryReplayed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "The idempotency key was used for a different request"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                idempotency_key_reused:
                  $ref: "#/components/examples/error-idempotency_key_reused"
        "422":
          description: "A template rule or a posting rule refused the request; nothing was posted"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                missing_amount:
                  $ref: "#/components/examples/error-missing_amount"
                unexpected_amount:
                  $ref: "#/components/examples/error-unexpected_amount"
                non_positive_amount:
                  $ref: "#/components/examples/error-non_positive_amount"
                missing_account:
                  $ref: "#/components/examples/error-missing_account"
                unexpected_account:
                  $ref: "#/components/examples/error-unexpected_account"
                bound_account_not_found:
                  $ref: "#/components/examples/error-bound_account_not_found"
                account_not_allowed:
                  $ref: "#/components/examples/error-account_not_allowed"
                same_account:
                  $ref: "#/components/examples/error-same_account"
                reserved_metadata:
                  $ref: "#/components/examples/error-reserved_metadata"
                amount_not_whole_balance:
                  $ref: "#/components/examples/error-amount_not_whole_balance"
                account_not_new:
                  $ref: "#/components/examples/error-account_not_new"
                fee_exceeds_amount:
                  $ref: "#/components/examples/error-fee_exceeds_amount"
                amount_currency_mismatch:
                  $ref: "#/components/examples/error-amount_currency_mismatch"
                amount_too_large:
                  $ref: "#/components/examples/error-amount_too_large"
                missing_metadata:
                  $ref: "#/components/examples/error-missing_metadata"
                invalid_metadata:
                  $ref: "#/components/examples/error-invalid_metadata"
                missing_refunded_entry:
                  $ref: "#/components/examples/error-missing_refunded_entry"
                unexpected_refunded_entry:
                  $ref: "#/components/examples/error-unexpected_refunded_entry"
                too_few_lines:
                  $ref: "#/components/examples/error-too_few_lines"
                too_many_lines:
                  $ref: "#/components/examples/error-too_many_lines"
                metadata_too_large:
                  $ref: "#/components/examples/error-metadata_too_large"
                amount_not_positive:
                  $ref: "#/components/examples/error-amount_not_positive"
                account_not_found:
                  $ref: "#/components/examples/error-account_not_found"
                account_not_open:
                  $ref: "#/components/examples/error-account_not_open"
                currency_mismatch:
                  $ref: "#/components/examples/error-currency_mismatch"
                duplicate_line:
                  $ref: "#/components/examples/error-duplicate_line"
                amount_overflow:
                  $ref: "#/components/examples/error-amount_overflow"
                unbalanced:
                  $ref: "#/components/examples/error-unbalanced"
                account_total_overflow:
                  $ref: "#/components/examples/error-account_total_overflow"
                insufficient_funds:
                  $ref: "#/components/examples/error-insufficient_funds"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/operations/merchant_payment.v1:
    post:
      operationId: "postMerchantPaymentV1"
      tags:
        - "Payments"
      summary: "Pay a merchant, with fees, from any channel"
      description: "Books `merchant_payment.v1` (worked entries E07, E08, E09). The request binds each role to an account and gives each amount; the template turns it into one balanced entry, which the ledger posts in one transaction. The client decides whether the operation is allowed (ADR-0002); the ledger decides how it is booked."
      x-mezgeb-template: {"id": "merchant_payment.v1", "roles": ["payer_wallet", "merchant_balance"], "optional_roles": ["fee_revenue"], "amounts": ["amount"], "optional_amounts": ["merchant_fee", "payer_fee"], "metadata": ["channel"], "refunds": false}
      security:
        - oauth2:
            - "operations:write"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantPaymentV1Request"
            example:
              accounts:
                payer_wallet: "2010:cust-abebe"
                merchant_balance: "2030:merch-coffee"
                fee_revenue: "4010"
              amounts:
                amount:
                  amount: "100.00"
                  currency: "ETB"
                merchant_fee:
                  amount: "2.00"
                  currency: "ETB"
              metadata:
                channel: "qr"
                order: "order-81"
      responses:
        "201":
          $ref: "#/components/responses/EntryPosted"
        "200":
          $ref: "#/components/responses/EntryReplayed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "The idempotency key was used for a different request"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                idempotency_key_reused:
                  $ref: "#/components/examples/error-idempotency_key_reused"
        "422":
          description: "A template rule or a posting rule refused the request; nothing was posted"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                missing_amount:
                  $ref: "#/components/examples/error-missing_amount"
                unexpected_amount:
                  $ref: "#/components/examples/error-unexpected_amount"
                non_positive_amount:
                  $ref: "#/components/examples/error-non_positive_amount"
                missing_account:
                  $ref: "#/components/examples/error-missing_account"
                unexpected_account:
                  $ref: "#/components/examples/error-unexpected_account"
                bound_account_not_found:
                  $ref: "#/components/examples/error-bound_account_not_found"
                account_not_allowed:
                  $ref: "#/components/examples/error-account_not_allowed"
                same_account:
                  $ref: "#/components/examples/error-same_account"
                reserved_metadata:
                  $ref: "#/components/examples/error-reserved_metadata"
                amount_not_whole_balance:
                  $ref: "#/components/examples/error-amount_not_whole_balance"
                account_not_new:
                  $ref: "#/components/examples/error-account_not_new"
                fee_exceeds_amount:
                  $ref: "#/components/examples/error-fee_exceeds_amount"
                amount_currency_mismatch:
                  $ref: "#/components/examples/error-amount_currency_mismatch"
                amount_too_large:
                  $ref: "#/components/examples/error-amount_too_large"
                missing_metadata:
                  $ref: "#/components/examples/error-missing_metadata"
                invalid_metadata:
                  $ref: "#/components/examples/error-invalid_metadata"
                missing_refunded_entry:
                  $ref: "#/components/examples/error-missing_refunded_entry"
                unexpected_refunded_entry:
                  $ref: "#/components/examples/error-unexpected_refunded_entry"
                too_few_lines:
                  $ref: "#/components/examples/error-too_few_lines"
                too_many_lines:
                  $ref: "#/components/examples/error-too_many_lines"
                metadata_too_large:
