$kind: http-example
name: The balance.
request:
  url: "{{baseUrl}}/v1/accounts/:account_id/balance?as_of=2026-11-14T00:00:00Z"
  method: GET
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/json
  queryParams:
    as_of: 2026-11-14T00:00:00Z
  pathVariables:
    - key: account_id
      value: db42271e-18fb-74c3-be54-32899ef41292
      disabled: false
      description: (Required) The account.
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "account": "0192f3c4-0000-7000-8000-000000000002",
        "as_of": "2026-11-14T00:00:00Z",
        "balance": {
          "amount": "470.00",
          "currency": "ETB"
        },
        "debits_total": {
          "amount": "1000.00",
          "currency": "ETB"
        },
        "credits_total": {
          "amount": "1470.00",
          "currency": "ETB"
        }
      }
order: 1000
