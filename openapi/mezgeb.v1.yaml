              reason: "goodwill_credit"
              lines:
                - account: "5010"
                  side: "debit"
                  amount:
                    amount: "10.00"
                    currency: "ETB"
                - account: "2010:cust-abebe"
                  side: "credit"
                  amount:
                    amount: "10.00"
                    currency: "ETB"
              metadata:
                ticket: "CS-2201"
