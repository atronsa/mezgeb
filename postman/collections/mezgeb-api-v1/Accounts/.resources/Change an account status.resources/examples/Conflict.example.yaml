$kind: http-example
request:
  url: "{{baseUrl}}/v1/accounts/:account_id/status"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Idempotency-Key
      value: pay-2026-11-14-0001
      disabled: false
      description: (Required) Makes a write safe to retry. The same key with the same request returns the original result; with a different request, `409 idempotency_key_reused`. Keys are per client and kept for at least 30 days (ADR-0008).
    - key: Accept
      value: application/problem+json
  pathVariables:
    - key: account_id
      value: db42271e-18fb-74c3-be54-32899ef41292
      disabled: false
      description: (Required) The account.
  body:
    type: json
    content: |-
      {
        "status": "frozen",
        "reason": "fraud_review"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:invalid_status_change",
        "title": "The account cannot change to that status",
        "status": 409,
        "code": "invalid_status_change",
        "detail": "The account cannot change to that status.",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 6000
