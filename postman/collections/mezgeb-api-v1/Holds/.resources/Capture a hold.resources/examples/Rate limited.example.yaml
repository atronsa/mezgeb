$kind: http-example
request:
  url: "{{baseUrl}}/v1/holds/:hold_id/capture"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Idempotency-Key
      value: pay-2026-11-14-0001
      disabled: false
      description: (Required) Makes a write safe to retry. The same key with the same request returns the original result; with a different request, `409 idempotency_key_reused`. Keys are per client and kept for at least 30 days (ADR-0008).
    - key: Accept
      value: application/problem+json
  pathVariables:
    - key: hold_id
      value: df1b2b83-8b54-739e-852e-21a0f85d0007
      disabled: false
      description: (Required) The hold.
  body:
    type: json
    content: |-
      {
        "destination": "2030:merch-coffee",
        "amount": {
          "amount": "250.00",
          "currency": "ETB"
        }
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    - key: Retry-After
      value: "4810"
      disabled: false
      description: Seconds to wait before retrying.
    - key: Content-Type
      value: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:rate_limited",
        "title": "Too many requests",
        "status": 429,
        "code": "rate_limited",
        "detail": "Too many requests.",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 8000
