$kind: collection
name: Mezgeb API smoke run
description: |-
  A scripted run against a live mezgeb-api, used by CI against the container
  (the `api-container` job). It opens wallets, funds one, transfers, replays
  and reuses idempotency keys, and checks the refusals (bad amounts, missing
  keys and tokens, missing scopes) with their Problem Details codes.

  It starts by exchanging two credentials for tokens at `/oauth/token`.
  Set `baseUrl`, `clientId` and `clientSecret` (a poster and reader), and
  `operatorId` and `operatorSecret` (an admin, for system accounts); the
  defaults are the development credentials of deploy/clients.dev.toml.
  Every run uses fresh references and keys, so it can run again against the
  same database.
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{clientToken}}'
variables:
  - key: baseUrl
    value: http://localhost:8080
  - key: clientId
    value: 0192f3c4-0000-7000-8000-0000000c0001
    description: A credential with the poster and reader roles.
  - key: clientSecret
    value: dev-wallet-secret-0001
    description: Its secret (development only).
  - key: operatorId
    value: 0192f3c4-0000-7000-8000-0000000c0002
    description: A credential with the admin role, for system accounts.
  - key: operatorSecret
    value: dev-operator-secret-0002
    description: Its secret (development only).
  - key: clientToken
    value: ''
    description: Set by "Get a client token".
  - key: operatorToken
    value: ''
    description: Set by "Get an operator token".
scripts:
  - type: http:beforeRequest
    language: text/javascript
    code: |-
      if (!pm.collectionVariables.get('runId')) {
        pm.collectionVariables.set('runId', String(Date.now()));
      }
  - type: http:afterResponse
    language: text/javascript
    code: |-
      const type = pm.response.headers.get('Content-Type') || '';
      const oauth = pm.request.url.getPath() === '/oauth/token';
      if (pm.response.code >= 400 && !oauth) {
        pm.test('an error is Problem Details', () => {
          pm.expect(type).to.include('application/problem+json');
          const body = pm.response.json();
          pm.expect(body.status).to.equal(pm.response.code);
          pm.expect(body.type).to.equal('urn:mezgeb:problem:' + body.code);
          pm.expect(body.instance).to.match(/^urn:uuid:/);
        });
      }
