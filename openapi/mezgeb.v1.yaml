      responses:
        "200":
          description: "The events"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /oauth/token:
    post:
      operationId: "issueToken"
      tags:
        - "OAuth"
      summary: "Get an access token"
      description: |-
        OAuth 2.0 client credentials (RFC 6749 §4.4). Authenticate with HTTP Basic: the credential's ID as the user name and its secret as the password. Credentials in the body are refused. The token lives 15 minutes by default and carries the scopes the credential's roles grant (the permission matrix, ADR-0017), or the subset asked for with `scope`. Revoking the credential, or disabling its client, ends the token at once.

        Errors are RFC 6749 §5.2 objects (`{"error": "invalid_client"}`), not Problem Details. An unknown credential, a revoked one and a wrong secret are all `401 invalid_client`.
      security:
        - clientSecretBasic: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/TokenRequest"
            example:
              grant_type: "client_credentials"
              scope: "accounts:read operations:write"
      responses:
        "200":
          description: "Issued"
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              example:
                access_token: "mzt_4f9c2a8e7b1d3f5a6c8e0b2d4f6a8c0e2b4d6f8a0c2e4b6d8f0a2c4e6b8d0f2a"
                token_type: "Bearer"
                expires_in: 900
                scope: "accounts:read operations:write"
        "400":
          description: "Bad request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              examples:
                unsupported_grant_type:
                  value:
                    error: "unsupported_grant_type"
                    error_description: "Only grant_type=client_credentials is supported."
                invalid_scope:
                  value:
                    error: "invalid_scope"
                    error_description: "The credential's roles do not grant \"periods:close\"."
        "401":
          description: "Bad client"
          headers:
            WWW-Authenticate:
              description: "`Basic realm=\"mezgeb\"`."
              schema:
                type: "string"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: "invalid_client"
                error_description: "Client authentication failed."
        "429":
          description: "Slow down"
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: "slow_down"
                error_description: "Too many token requests for this credential; retry after Retry-After seconds."
        "503":
          description: "Unavailable"
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
              example:
                error: "temporarily_unavailable"
                error_description: "The token could not be issued; retry."
  /v1/reconciliation/balances:
    post:
      operationId: "compareCachedBalances"
      tags:
        - "Reconciliation"
      summary: "Compare cached balances"
      description: "Compares up to 1,000 of the caller's cached balances with the ledger's (ADR-0002: the ledger is the system of record; ADR-0020). Each balance may name the posting sequence the cache reflects, so that an entry posted while the cache was read is not a disagreement; without it, the balance now is compared. A disagreement is a `stale_cache` break, and the answer carries the ledger's balance: the ledger wins, and the client refreshes its cache from it, never the other way. A later call that agrees clears the break. Only the caller's own accounts: any other is `404`."
      security:
        - oauth2:
            - "reconciliation:write"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CachedBalancesRequest"
            example:
              balances:
                - account: "2010:cust-abebe"
                  balance:
                    amount: "830.00"
                    currency: "ETB"
                  as_of_sequence: 1042
      responses:
        "200":
          description: "Each balance compared"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CachedBalancesResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/reconciliation/breaks:
    get:
      operationId: "listReconciliationBreaks"
      tags:
        - "Reconciliation"
      summary: "List reconciliation breaks"
      description: "Disagreements found by reconciliation, oldest first (ADR-0020): the bank statement against an account such as 1010, clients' caches, and offline devices and escrows. Open ones unless `status` says otherwise. Pages continue with `after`."
      security:
        - oauth2:
            - "reconciliation:read"
      parameters:
        - name: "status"
          in: "query"
          required: false
          description: "Open (the default), cleared, resolved, explained, or all."
          schema:
            type: "string"
            enum:
              - "open"
              - "cleared"
              - "resolved"
              - "explained"
              - "all"
        - name: "kind"
          in: "query"
          required: false
          schema:
            $ref: "#/components/schemas/BreakKind"
        - name: "account"
          in: "query"
          required: false
          description: "Breaks about this account, by ID or reference."
          schema:
            type: "string"
        - name: "after"
          in: "query"
          required: false
          description: "The `next_after` of the previous page."
          schema:
            $ref: "#/components/schemas/Uuid7"
        - name: "limit"
          in: "query"
          required: false
          description: "1 to 1,000; 100 by default."
          schema:
            type: "integer"
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: "The breaks"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconBreakList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/reconciliation/breaks/{break_id}:
    get:
      operationId: "getReconciliationBreak"
      tags:
        - "Reconciliation"
      summary: "Get a reconciliation break"
      description: "One break, with how it closed, if it has."
      security:
        - oauth2:
            - "reconciliation:read"
      parameters:
        - name: "break_id"
          in: "path"
          required: true
          description: "The break."
          schema:
            $ref: "#/components/schemas/Uuid7"
      responses:
        "200":
          description: "The break"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconBreak"
              example:
                id: "0192f3c4-0000-7000-8000-00000000b001"
                run: "0192f3c4-0000-7000-8000-00000000a001"
                kind: "amount_mismatch"
                status: "open"
                subject: "item:0192f3c4-0000-7000-8000-00000000c001"
                account: "0192f3c4-0000-7000-8000-000000001010"
                client: null
                statement_line: "0192f3c4-0000-7000-8000-00000000c001"
                ledger_line:
                  entry: "0192f3c4-0000-7000-8000-000000000e03"
                  line: 0
                device: null
                voucher: null
                other:
                  amount: "190.00"
                  currency: "ETB"
                ledger:
                  amount: "200.00"
                  currency: "ETB"
                difference:
                  amount: "-10.00"
                  currency: "ETB"
                detail: "the bank's line B3 and the ledger line with its bank_ref differ"
                found_at: "2026-11-17T06:00:00Z"
                cleared_by_run: null
                resolution: null
                note: null
                closed_by: null
                closed_at: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/reconciliation/breaks/{break_id}/resolve:
    post:
      operationId: "resolveReconciliationBreak"
      tags:
        - "Reconciliation"
      summary: "Resolve a break"
      description: "Resolves a money break (`missing_in_ledger`, `missing_in_statement`, `amount_mismatch`, `duplicate_statement_line`) with the entry that made the account equal the bank again (ADR-0020 decision 7): one booked by `deposit_unmatched.v1` (the bank has more) or `bank_debit_unmatched.v1` (the bank has less), whose one line in the account equals the break's difference, and that has resolved no other break. The difference then waits in its suspense item, visible in ageing, until its cause is booked. For the operator's staff."
      security:
        - oauth2:
            - "reconciliation:resolve"
      parameters:
        - name: "break_id"
          in: "path"
          required: true
          description: "The break."
          schema:
            $ref: "#/components/schemas/Uuid7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveBreakRequest"
            example:
              entry_id: "0192f3c4-0000-7000-8000-000000000e09"
      responses:
        "200":
          description: "The resolved break"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconBreak"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "The break cannot close this way"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                break_closed:
                  $ref: "#/components/examples/error-break_closed"
                break_not_closable:
                  $ref: "#/components/examples/error-break_not_closable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/reconciliation/breaks/{break_id}/explain:
    post:
      operationId: "explainReconciliationBreak"
      tags:
        - "Reconciliation"
      summary: "Explain a break"
      description: "Closes a break that is not about money in an account (`statement_conflict`, `stale_cache`, and the offline kinds) with the operator's reason (ADR-0020 decision 8). A money break is refused: it closes only when a later run matches it or a suspense entry resolves it. For the operator's staff."
      security:
        - oauth2:
            - "reconciliation:resolve"
      parameters:
        - name: "break_id"
          in: "path"
          required: true
          description: "The break."
          schema:
            $ref: "#/components/schemas/Uuid7"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainBreakRequest"
            example:
              reason: "The bank corrected its export; the first copy is right."
      responses:
        "200":
          description: "The explained break"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconBreak"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "The break cannot close this way"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                break_closed:
                  $ref: "#/components/examples/error-break_closed"
                break_not_closable:
                  $ref: "#/components/examples/error-break_not_closable"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/reconciliation/runs:
    get:
      operationId: "listReconciliationRuns"
      tags:
        - "Reconciliation"
      summary: "List reconciliation runs"
      description: "The latest statement imports and reconciliation runs, newest first, with what each found and how long it took."
      security:
        - oauth2:
            - "reconciliation:read"
      parameters:
        - name: "kind"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "import"
              - "external"
              - "internal"
              - "offline"
        - name: "limit"
          in: "query"
          required: false
          description: "1 to 1,000; 50 by default."
          schema:
            type: "integer"
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: "The runs"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconRunList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    clientSecretBasic:
      type: "http"
      scheme: "basic"
      description: "The token endpoint only: a credential's ID and secret (RFC 6749 §2.3.1)."
    oauth2:
      type: "oauth2"
      description: "OAuth 2.0 client credentials (ADR-0017). Each client is a platform integrating with the ledger, and each of its credentials holds roles; a token carries the scopes its roles grant. Operator scopes go only to the operator's staff."
      flows:
        clientCredentials:
          tokenUrl: "/oauth/token"
          scopes:
            "accounts:read": "Read the accounts the client owns"
            "accounts:read_all": "Read every account (operator)"
            "accounts:write": "Open accounts"
            "accounts:admin": "Freeze, unfreeze and close accounts (operator)"
            "operations:write": "Post through the posting templates"
            "entries:read": "Read entries the client posted or that touch its accounts"
            "corrections:write": "Reverse entries (operator)"
            "adjustments:request": "Request adjustments (operator, maker)"
            "adjustments:approve": "Approve or reject adjustments (operator, checker)"
            "holds:read": "Read holds"
            "holds:write": "Place, capture and release holds"
            "periods:read": "Read accounting periods"
            "periods:close": "Close accounting periods (operator)"
            "reports:read": "Read trial balances and ageing (operator)"
            "audit:read": "Read the audit events of every client (auditor)"
            "offline:write": "Offline devices, vouchers and receipts"
            "offline:resolve": "Resolve offline disputes (operators)"
            "reconciliation:write": "Compare the client's cached balances with the ledger"
            "reconciliation:read": "Read reconciliation runs and breaks (operators, auditors)"
            "reconciliation:resolve": "Resolve and explain reconciliation breaks (operators)"
  parameters:
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      description: "Makes a write safe to retry. The same key with the same request returns the original result; with a different request, `409 idempotency_key_reused`. Keys are per client and kept for at least 30 days (ADR-0008)."
      schema:
        $ref: "#/components/schemas/IdempotencyKeyValue"
    Limit:
      name: "limit"
      in: "query"
      description: "Page size."
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: "cursor"
      in: "query"
      description: "An opaque cursor from `next_cursor`."
      schema:
        type: "string"
        maxLength: 512
  headers:
    Location:
      description: "The URL of the created resource."
      schema:
        type: "string"
    NoStore:
      description: "`no-store`: a token response is never cached (RFC 6749 §5.1)."
      schema:
        type: "string"
        enum:
          - "no-store"
    IdempotentReplayed:
      description: "`true` when the response repeats an earlier request with the same key."
      schema:
        type: "string"
        enum:
          - "true"
    RetryAfter:
      description: "Seconds to wait before retrying."
      schema:
        type: "integer"
        minimum: 1
  responses:
    EntryPosted:
      description: "Posted"
      headers:
        Location:
          $ref: "#/components/headers/Location"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Entry"
          example:
            id: "0192f3c4-0000-7000-8000-000000000007"
            sequence: 8
            kind: "standard"
            template: "merchant_payment.v1"
            period_id: 12
            recorded_at: "2026-11-14T09:30:12.418205Z"
            event_time: null
            lines:
              - account: "0192f3c4-0000-7000-8000-000000000002"
                side: "debit"
                amount:
                  amount: "100.00"
                  currency: "ETB"
              - account: "0192f3c4-0000-7000-8000-000000000004"
                side: "credit"
                amount:
                  amount: "98.00"
                  currency: "ETB"
              - account: "0192f3c4-0000-7000-8000-000000000005"
                side: "credit"
                amount:
                  amount: "2.00"
                  currency: "ETB"
            metadata:
              template: "merchant_payment.v1"
              channel: "qr"
              order: "order-81"
            reverses: null
            refunds: null
            authorization: null
            receipt: null
    EntryReplayed:
      description: "Replayed"
      headers:
        Idempotent-Replayed:
          $ref: "#/components/headers/IdempotentReplayed"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Entry"
    BadRequest:
      description: "Bad request"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalid_request:
              $ref: "#/components/examples/error-invalid_request"
            idempotency_key_required:
              $ref: "#/components/examples/error-idempotency_key_required"
    Unauthenticated:
      description: "Unauthenticated"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unauthenticated:
              $ref: "#/components/examples/error-unauthenticated"
    Forbidden:
      description: "Forbidden"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            forbidden:
              $ref: "#/components/examples/error-forbidden"
    NotFound:
      description: "Not found"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            not_found:
              $ref: "#/components/examples/error-not_found"
    InternalError:
      description: "Internal error"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            internal_error:
              $ref: "#/components/examples/error-internal_error"
            template_defect:
              $ref: "#/components/examples/error-template_defect"
    RateLimited:
      description: "Rate limited"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            rate_limited:
              $ref: "#/components/examples/error-rate_limited"
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
    Unavailable:
      description: "Unavailable"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            busy:
              $ref: "#/components/examples/error-busy"
            contention:
              $ref: "#/components/examples/error-contention"
            no_open_period:
              $ref: "#/components/examples/error-no_open_period"
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
  schemas:
    Hash:
      type: "string"
      pattern: "^[0-9a-f]{64}$"
      description: "A SHA-256 hash, in lower-case hex."
    KeyId:
      type: "string"
      pattern: "^[0-9a-f]{16}$"
    Signature:
      type: "string"
      pattern: "^[0-9a-f]{128}$"
      description: "An Ed25519 signature, in lower-case hex."
    Receipt:
      type: "object"
      additionalProperties: false
      description: "The entry's link in the hash chain, signed. Verify the signature over `mezgeb.receipt.v1\\0`, the position (8 bytes, big-endian), the entry ID (16 bytes) and the hash, with the key `key_id` from `/v1/keys`."
      required:
        - "position"
        - "entry"
        - "prev_hash"
        - "hash"
        - "key_id"
        - "signature"
      properties:
        position:
          type: "integer"
          minimum: 1
        entry:
          $ref: "#/components/schemas/EntryId"
        prev_hash:
          $ref: "#/components/schemas/Hash"
        hash:
          $ref: "#/components/schemas/Hash"
        key_id:
          oneOf:
            - $ref: "#/components/schemas/KeyId"
            - type: "null"
        signature:
          oneOf:
            - $ref: "#/components/schemas/Signature"
            - type: "null"
    SigningKey:
      type: "object"
      additionalProperties: false
      required:
        - "key_id"
        - "algorithm"
        - "public_key"
      properties:
        key_id:
          $ref: "#/components/schemas/KeyId"
        algorithm:
          type: "string"
          enum:
            - "Ed25519"
        public_key:
          type: "string"
          pattern: "^[0-9a-f]{64}$"
    SigningKeyList:
      type: "object"
      additionalProperties: false
      required:
        - "items"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/SigningKey"
    Checkpoint:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "period_id"
        - "position"
        - "hash"
        - "audit_position"
        - "audit_hash"
        - "at"
        - "key_id"
        - "signature"
        - "line"
      properties:
        id:
          type: "integer"
          minimum: 1
        period_id:
          type: "integer"
          minimum: 1
        position:
          type: "integer"
          minimum: 0
          description: "The entry chain's last position at the checkpoint."
        hash:
          $ref: "#/components/schemas/Hash"
        audit_position:
          type: "integer"
          minimum: 0
        audit_hash:
          $ref: "#/components/schemas/Hash"
        at:
          type: "string"
          format: "date-time"
        key_id:
          $ref: "#/components/schemas/KeyId"
        signature:
          $ref: "#/components/schemas/Signature"
        line:
          type: "string"
          description: "The checkpoint as one line of text, to store as a file."
    CheckpointList:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "next_cursor"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/Checkpoint"
        next_cursor:
          type:
            - "string"
            - "null"
    AuditEvent:
      type: "object"
      additionalProperties: false
      required:
        - "position"
        - "at"
        - "client"
        - "actor"
        - "action"
        - "target"
        - "request_id"
        - "outcome"
        - "details"
        - "hash"
      properties:
        position:
          type: "integer"
          minimum: 1
        at:
          type: "string"
          format: "date-time"
        client:
          oneOf:
            - $ref: "#/components/schemas/ClientId"
            - type: "null"
        actor:
          type:
            - "string"
            - "null"
        action:
          type: "string"
          description: "`METHOD /route/{pattern}` for an API request, or a named action such as `token.issue` or `credential.revoke`."
        target:
          type:
            - "string"
            - "null"
        request_id:
          type:
            - "string"
            - "null"
        outcome:
          type: "string"
          description: "`ok`, or why not: `refused`, `forbidden`, `unauthenticated`, `failed`."
        details:
          type: "object"
          description: "The status and code of a request; before and after for a change of configuration. Never bodies or secrets."
        hash:
          $ref: "#/components/schemas/Hash"
    AuditEventList:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "next_cursor"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_cursor:
          type:
            - "string"
            - "null"
    TokenRequest:
      type: "object"
      additionalProperties: false
      required:
        - "grant_type"
      properties:
        grant_type:
          type: "string"
          enum:
            - "client_credentials"
        scope:
          type: "string"
          description: "Space-separated scopes, at most those the credential's roles grant. Omitted: all of them."
          maxLength: 1024
    TokenResponse:
      type: "object"
      additionalProperties: false
      required:
        - "access_token"
        - "token_type"
        - "expires_in"
        - "scope"
      properties:
        access_token:
          type: "string"
          pattern: "^mzt_[0-9a-f]{64}$"
        token_type:
          type: "string"
          enum:
            - "Bearer"
        expires_in:
          type: "integer"
          minimum: 1
          description: "Seconds until the token expires."
        scope:
          type: "string"
          description: "The scopes granted, space-separated."
    OAuthError:
      type: "object"
      additionalProperties: false
      required:
        - "error"
      properties:
        error:
          type: "string"
          enum:
            - "invalid_request"
            - "invalid_client"
            - "unsupported_grant_type"
            - "invalid_scope"
            - "temporarily_unavailable"
            - "slow_down"
        error_description:
          type: "string"
    Uuid7:
      type: "string"
      format: "uuid"
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      description: "A lowercase UUIDv7, generated by the ledger (ADR-0006)."
    AccountId:
      allOf:
        - $ref: "#/components/schemas/Uuid7"
      description: "An account ID."
    ClientId:
      type: "string"
      format: "uuid"
      description: "A client: a platform integrating with the ledger (ADR-0017)."
    EntryId:
      allOf:
        - $ref: "#/components/schemas/Uuid7"
      description: "An entry ID."
    HoldId:
      allOf:
        - $ref: "#/components/schemas/Uuid7"
      description: "A hold ID."
    AdjustmentId:
      allOf:
        - $ref: "#/components/schemas/Uuid7"
      description: "An adjustment request ID."
    PeriodId:
      type: "integer"
      format: "int64"
      minimum: 1
    TemplateId:
      type: "string"
      pattern: "^[a-z][a-z0-9_]{0,63}\\.v[1-9][0-9]{0,4}$"
      examples:
        - "merchant_payment.v1"
    Reference:
      type: "string"
      pattern: "^[0-9]{4}(:[a-z]{2,8}-[a-z0-9-]{1,60})?$"
      description: "A chart reference: a system account (`1010`) or a sub-account (`2010:cust-abebe`)."
      examples:
        - "2010:cust-abebe"
    AccountRef:
      type: "string"
      description: "An account, by ID or by chart reference."
      oneOf:
        - $ref: "#/components/schemas/AccountId"
        - $ref: "#/components/schemas/Reference"
      examples:
        - "2010:cust-abebe"
    IdempotencyKeyValue:
      type: "string"
      pattern: "^[A-Za-z0-9._:-]{1,128}$"
      examples:
        - "pay-2026-11-14-0001"
    Currency:
      type: "string"
      pattern: "^[A-Z]{3}$"
      description: "An ISO 4217 code the ledger supports."
      examples:
        - "ETB"
    Money:
      type: "object"
      additionalProperties: false
      required:
        - "amount"
        - "currency"
      properties:
        amount:
          type: "string"
          pattern: "^-?(0|[1-9][0-9]{0,17})(\\.[0-9]{1,4})?$"
          description: "A decimal amount, with at most the currency's minor-unit digits (ETB: 2). Never a JSON number."
          examples:
            - "39.20"
        currency:
          $ref: "#/components/schemas/Currency"
      description: "An amount with its currency (ADR-0005, ADR-0009)."
    PositiveMoney:
      allOf:
        - $ref: "#/components/schemas/Money"
      description: "Greater than zero."
    NonNegativeMoney:
      allOf:
        - $ref: "#/components/schemas/Money"
      description: "Zero or more."
    Side:
      type: "string"
      enum:
        - "debit"
        - "credit"
    Metadata:
      type: "object"
      maxProperties: 32
      additionalProperties:
        type: "string"
        maxLength: 512
      propertyNames:
        pattern: "^[a-z][a-z0-9_]{0,63}$"
      description: "Client references, copied into the entry, never used for accounting. At most 32 keys and 4096 bytes in all. The key `template` is reserved."
    EventTime:
      type:
        - "string"
        - "null"
      format: "date-time"
      description: "When the event happened, if the client knows (an offline payment). Informational: the entry is posted now, into the open period (INV-12)."
    Account:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "reference"
        - "code"
        - "name"
        - "type"
        - "normal_side"
        - "currency"
        - "status"
        - "allow_negative"
        - "balance"
        - "debits_total"
        - "credits_total"
      properties:
        id:
          $ref: "#/components/schemas/AccountId"
        reference:
          $ref: "#/components/schemas/Reference"
        code:
          type: "integer"
        sub_account:
          type:
            - "string"
            - "null"
        name:
          type: "string"
        type:
          type: "string"
          enum:
            - "asset"
            - "liability"
            - "equity"
            - "revenue"
            - "expense"
        normal_side:
          $ref: "#/components/schemas/Side"
        currency:
          $ref: "#/components/schemas/Currency"
        status:
          type: "string"
          enum:
            - "open"
            - "frozen"
            - "closed"
        allow_negative:
          type: "boolean"
        balance:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: "On the normal side."
        debits_total:
          $ref: "#/components/schemas/Money"
        credits_total:
          $ref: "#/components/schemas/Money"
    AccountPage:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "next_cursor"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/Account"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    NextCursor:
      type:
        - "string"
        - "null"
      description: "Pass as `cursor` for the next page; `null` on the last page."
    OpenAccountRequest:
      type: "object"
      additionalProperties: false
      required:
        - "reference"
      properties:
        reference:
          $ref: "#/components/schemas/Reference"
    ChangeStatusRequest:
      type: "object"
      additionalProperties: false
      required:
        - "status"
        - "reason"
      properties:
        status:
          type: "string"
          enum:
            - "open"
            - "frozen"
            - "closed"
        reason:
          type: "string"
          pattern: "^[a-z0-9_]{1,64}$"
    Balance:
      type: "object"
      additionalProperties: false
      required:
        - "account"
        - "as_of"
        - "balance"
        - "debits_total"
        - "credits_total"
      properties:
        account:
          $ref: "#/components/schemas/AccountId"
        as_of:
          type: "string"
          format: "date-time"
        balance:
          $ref: "#/components/schemas/Money"
        debits_total:
          $ref: "#/components/schemas/Money"
        credits_total:
          $ref: "#/components/schemas/Money"
    LedgerLine:
      type: "object"
      additionalProperties: false
      required:
        - "entry"
        - "sequence"
        - "recorded_at"
        - "side"
        - "amount"
        - "balance"
      properties:
        entry:
          $ref: "#/components/schemas/EntryId"
        sequence:
          type: "integer"
          format: "int64"
        recorded_at:
          type: "string"
          format: "date-time"
        side:
          $ref: "#/components/schemas/Side"
        amount:
          $ref: "#/components/schemas/Money"
        balance:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: "After this line, on the normal side."
    LedgerPage:
      type: "object"
      additionalProperties: false
      required:
        - "account"
        - "opening_balance"
        - "items"
        - "next_cursor"
      properties:
        account:
          $ref: "#/components/schemas/AccountId"
        opening_balance:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: "Before the first line of this page."
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/LedgerLine"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    Template:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "roles"
        - "amounts"
        - "optional_amounts"
        - "metadata"
        - "refunds"
      properties:
        id:
          $ref: "#/components/schemas/TemplateId"
        roles:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "name"
              - "codes"
              - "optional"
            properties:
              name:
                type: "string"
              codes:
                type: "array"
                items:
                  type: "integer"
              optional:
                type: "boolean"
        amounts:
          type: "array"
          items:
            type: "string"
        optional_amounts:
          type: "array"
          items:
            type: "string"
        metadata:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            required:
              - "name"
              - "required"
              - "values"
            properties:
              name:
                type: "string"
              required:
                type: "boolean"
              values:
                type: "array"
                items:
                  type: "string"
        refunds:
          type: "boolean"
    EntryLine:
      type: "object"
      additionalProperties: false
      required:
        - "account"
        - "side"
        - "amount"
      properties:
        account:
          $ref: "#/components/schemas/AccountId"
        side:
          $ref: "#/components/schemas/Side"
        amount:
          $ref: "#/components/schemas/Money"
    Authorization:
      type:
        - "object"
        - "null"
      additionalProperties: false
      required:
        - "reason"
        - "requested_by"
      properties:
        reason:
          type: "string"
        requested_by:
          type: "string"
        approved_by:
          type:
            - "string"
            - "null"
    Entry:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "sequence"
        - "kind"
        - "template"
        - "period_id"
        - "recorded_at"
        - "event_time"
        - "lines"
        - "metadata"
        - "reverses"
        - "refunds"
        - "authorization"
        - "receipt"
      properties:
        id:
          $ref: "#/components/schemas/EntryId"
        sequence:
          type: "integer"
          format: "int64"
          description: "Posting order (INV-12)."
        kind:
          type: "string"
          enum:
            - "standard"
            - "reversal"
            - "adjustment"
            - "refund"
        template:
          oneOf:
            - $ref: "#/components/schemas/TemplateId"
            - type: "null"
          description: "The template that booked it; `null` for a reversal or an adjustment."
        period_id:
          $ref: "#/components/schemas/PeriodId"
        recorded_at:
          type: "string"
          format: "date-time"
        event_time:
          $ref: "#/components/schemas/EventTime"
        lines:
          type: "array"
          minItems: 2
          items:
            $ref: "#/components/schemas/EntryLine"
        metadata:
          type: "object"
          additionalProperties:
            type: "string"
        reverses:
          oneOf:
            - $ref: "#/components/schemas/EntryId"
            - type: "null"
        refunds:
          oneOf:
            - $ref: "#/components/schemas/EntryId"
            - type: "null"
        authorization:
          $ref: "#/components/schemas/Authorization"
        receipt:
          description: "The signed ledger receipt (spec §7.2, INV-26): proof, verifiable with the public key alone, that the ledger recorded this entry at this position of its hash chain. `null` only for entries posted before the chain began."
          oneOf:
            - $ref: "#/components/schemas/Receipt"
            - type: "null"
    ReversalRequest:
      type: "object"
      additionalProperties: false
      required:
        - "reason"
      properties:
        reason:
          type: "string"
          enum:
            - "booking_error"
            - "duplicate_posting"
        note:
          type: "string"
          maxLength: 500
    AdjustmentLine:
      type: "object"
      additionalProperties: false
      required:
        - "account"
        - "side"
        - "amount"
      properties:
        account:
          $ref: "#/components/schemas/AccountRef"
        side:
          $ref: "#/components/schemas/Side"
        amount:
          $ref: "#/components/schemas/PositiveMoney"
    AdjustmentRequestInput:
      type: "object"
      additionalProperties: false
      required:
        - "reason"
        - "lines"
      properties:
        reason:
          type: "string"
          enum:
            - "goodwill_credit"
            - "compensation"
            - "bank_charge"
            - "write_off"
            - "data_migration"
        lines:
          type: "array"
          minItems: 2
          maxItems: 100
          items:
            $ref: "#/components/schemas/AdjustmentLine"
        metadata:
          $ref: "#/components/schemas/Metadata"
        note:
          type: "string"
          maxLength: 500
    AdjustmentRequest:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "status"
        - "reason"
        - "lines"
        - "requested_by"
        - "requested_at"
      properties:
        id:
          $ref: "#/components/schemas/AdjustmentId"
        status:
          type: "string"
          enum:
            - "pending"
            - "approved"
            - "rejected"
        reason:
          type: "string"
        lines:
          type: "array"
          items:
            $ref: "#/components/schemas/EntryLine"
        metadata:
          type: "object"
          additionalProperties:
            type: "string"
        requested_by:
          type: "string"
        requested_at:
          type: "string"
          format: "date-time"
        decided_by:
          type:
            - "string"
            - "null"
        decided_at:
          type:
            - "string"
            - "null"
          format: "date-time"
        entry:
          oneOf:
            - $ref: "#/components/schemas/EntryId"
            - type: "null"
          description: "The posted adjustment, once approved."
    RejectionRequest:
      type: "object"
      additionalProperties: false
      required:
        - "note"
      properties:
        note:
          type: "string"
          minLength: 1
          maxLength: 500
    PlaceHoldRequest:
      type: "object"
      additionalProperties: false
      required:
        - "account"
        - "held_account"
        - "amount"
        - "expires_at"
      properties:
        account:
          $ref: "#/components/schemas/AccountRef"
        held_account:
          $ref: "#/components/schemas/AccountRef"
        amount:
          $ref: "#/components/schemas/PositiveMoney"
        expires_at:
          type: "string"
          format: "date-time"
    CaptureHoldRequest:
      type: "object"
      additionalProperties: false
      required:
        - "destination"
        - "amount"
      properties:
        destination:
          $ref: "#/components/schemas/AccountRef"
        amount:
          $ref: "#/components/schemas/PositiveMoney"
    Hold:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "account"
        - "held_account"
        - "amount"
        - "captured"
        - "status"
