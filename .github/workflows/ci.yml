name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --shm-size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      MEZGEB_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Create database roles
        run: |
          for file in db/init/*.sql; do
            psql "$MEZGEB_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The simulator against the reference ledger, then against PostgreSQL
      # with faults injected on 10% of attempts (step 1.15).
      - run: cargo run -p mezgeb-sim -- --seed 1 --ops 10000
      - run: cargo run -p mezgeb-sim -- --seed 1 --ops 2000 --lanes 8 --faults 100 --database-url "$MEZGEB_TEST_DATABASE_URL"
      # A short benchmark run, to keep it working; the baseline itself runs
      # in the bench workflow (step 1.16).
      - run: cargo run -p mezgeb-bench -- --database-url "$MEZGEB_TEST_DATABASE_URL" --wallets 100 --warmup 1 --seconds 2 --runs 1
      # Every database test verifies its own ledger before dropping it. This
      # step also verifies a ledger written by the engine and interrupted
      # mid-posting, with the operator's command (step 1.13 exit gate).
      - name: Verify a ledger written by the engine
        run: |
          cargo build -q -p mezgeb-cli
          cargo build -q -p mezgeb-engine --example crash_writer
          target/debug/examples/crash_writer setup postgres://mezgeb_owner:mezgeb_owner@localhost:5432/mezgeb
          timeout -s KILL 10 target/debug/examples/crash_writer write postgres://mezgeb_app:mezgeb_app@localhost:5432/mezgeb || true
          target/debug/mezgeb-cli verify --full --settle-seconds 0 --database-url postgres://mezgeb_verifier:mezgeb_verifier@localhost:5432/mezgeb
