        "500":
          $ref: "#/components/responses/InternalError"
  /v1/holds:
    post:
      operationId: "placeHold"
      tags:
        - "Holds"
      summary: "Place a hold"
      description: "Reserves money by moving it from an account into the hold's own held account, until it is captured, released or expires (ADR-0004). The held account is a new, unused account of the same type."
      security:
        - oauth2:
            - "holds:write"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceHoldRequest"
            example:
              account: "2010:cust-abebe"
              held_account: "2010:cust-abebe-hold-0001"
              amount:
                amount: "300.00"
                currency: "ETB"
              expires_at: "2026-11-15T09:00:00Z"
      responses:
        "200":
          description: "A repeat of a request that already placed this hold."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hold"
        "201":
          description: "The hold."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hold"
              example:
                id: "0192f3c4-0000-7000-9000-000000000001"
                account: "0192f3c4-0000-7000-8000-000000000002"
                held_account: "0192f3c4-0000-7000-8000-00000000000a"
                amount:
                  amount: "300.00"
                  currency: "ETB"
                captured:
                  amount: "0.00"
                  currency: "ETB"
                status: "active"
                expires_at: "2026-11-15T09:00:00Z"
                place_entry: "0192f3c4-0000-7000-8000-000000000011"
                close_entry: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "The idempotency key was reused"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                idempotency_key_reused:
                  $ref: "#/components/examples/error-idempotency_key_reused"
        "422":
          description: "The hold was refused"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                invalid_held_account:
                  $ref: "#/components/examples/error-invalid_held_account"
                account_is_held:
                  $ref: "#/components/examples/error-account_is_held"
                insufficient_funds:
                  $ref: "#/components/examples/error-insufficient_funds"
                account_not_open:
                  $ref: "#/components/examples/error-account_not_open"
                currency_mismatch:
                  $ref: "#/components/examples/error-currency_mismatch"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/holds/{hold_id}:
