# Dependency checks with cargo-deny (`cargo deny check`), run in CI by the
# `deps` workflow: known vulnerabilities, licences and sources.

[graph]
all-features = true

[advisories]
# Fail on any crate with a RustSec advisory: vulnerable, unsound or
# unmaintained. A finding we accept goes in `ignore`, with the reason.
ignore = []

[licenses]
# Permissive licences only, compatible with Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9
# Some licences above are allowed ahead of need; no warning while unused.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are not published, but are Apache-2.0 like the rest.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Our own crates depend on each other by path, with no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
