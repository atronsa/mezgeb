$kind: http-example
request:
  url: "{{baseUrl}}/v1/reconciliation/breaks/:break_id/explain"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/problem+json
  pathVariables:
    - key: break_id
      value: 5cae026c-278e-7ac0-b56f-144db7afb1b8
      disabled: false
      description: (Required) The break.
  body:
    type: json
    content: |-
      {
        "reason": "The bank corrected its export; the first copy is right."
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:break_closed",
        "title": "The break is already closed",
        "status": 409,
        "code": "break_closed",
        "detail": "the break is already resolved",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 6000
