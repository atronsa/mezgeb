$kind: http-request
description: "One frozen voucher's case."
url: "{{baseUrl}}/v1/offline/disputes/:dispute_id"
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: dispute_id
    value: 0192f3c4-0000-7000-8000-000000000f11
    disabled: false
    description: (Required) The dispute.
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /oauth/token
    scope: accounts:read accounts:read_all accounts:write accounts:admin operations:write entries:read corrections:write adjustments:request adjustments:approve holds:read holds:write periods:read periods:close reports:read offline:write offline:resolve
    grant_type: client_credentials
settings: {}
examples: ./.resources/Get an offline dispute.resources/examples
order: 6100
