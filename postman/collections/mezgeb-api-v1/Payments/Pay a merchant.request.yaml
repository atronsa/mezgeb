$kind: http-request
description: Books `merchant_payment.v1` (worked entries E07, E08, E09). The request binds each role to an account and gives each amount; the template turns it into one balanced entry, which the ledger posts in one transaction. The client decides whether the operation is allowed (ADR-0002); the ledger decides how it is booked.
url: "{{baseUrl}}/v1/operations/merchant_payment.v1"
method: POST
headers:
  - key: Idempotency-Key
    value: pay-2026-11-14-0001
    disabled: false
    description: (Required) Makes a write safe to retry. The same key with the same request returns the original result; with a different request, `409 idempotency_key_reused`. Keys are per client and kept for at least 30 days (ADR-0008).
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "accounts": {
        "payer_wallet": "2010:cust-abebe",
        "merchant_balance": "2030:merch-coffee",
        "fee_revenue": "4010"
      },
      "amounts": {
        "amount": {
          "amount": "100.00",
          "currency": "ETB"
        },
        "merchant_fee": {
          "amount": "2.00",
          "currency": "ETB"
        }
      },
      "metadata": {
        "channel": "qr",
        "order": "order-81"
      }
    }
auth:
  type: oauth2
  credentials:
    accessTokenUrl: /oauth/token
    scope: accounts:read accounts:read_all accounts:write accounts:admin operations:write entries:read corrections:write adjustments:request adjustments:approve holds:read holds:write periods:read periods:close reports:read offline:write
    grant_type: client_credentials
settings: {}
examples: ./.resources/Pay a merchant.resources/examples
order: 2000
