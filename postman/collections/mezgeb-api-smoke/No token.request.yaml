$kind: http-request
url: '{{baseUrl}}/v1/accounts/{{walletA}}'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('401 unauthenticated', () => {
        pm.response.to.have.status(401);
        pm.expect(pm.response.json().code).to.equal('unauthenticated');
      });
order: 14000
