$kind: http-example
request:
  url: "{{baseUrl}}/v1/holds/:hold_id"
  method: GET
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/problem+json
  pathVariables:
    - key: hold_id
      value: df1b2b83-8b54-739e-852e-21a0f85d0007
      disabled: false
      description: (Required) The hold.
  body:
    type: text
    content: ""
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:forbidden",
        "title": "The caller may not do this",
        "status": 403,
        "code": "forbidden",
        "detail": "The caller may not do this.",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 4000
