  body:
    type: json
    content: |-
      {
        "items": [
          {
            "id": "0192f3c4-0000-7000-8000-000000000f01",
            "owner_account": "0192f3c4-0000-7000-8000-000000000002",
            "device": "0192f3c4-0000-7000-8000-000000000d01",
            "counter": 1,
            "amount": {
              "amount": "65.00",
              "currency": "ETB"
            },
            "entry": "0192f3c4-0000-7000-8000-000000000f02",
            "repaid_entry": null
          }
        ]
      }
order: 1000
