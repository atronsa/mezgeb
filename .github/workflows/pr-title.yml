# Checks that every pull request title follows Conventional Commits, such as
# "feat: add holds" or "fix(engine): retry on deadlock".
#
# Pull requests are merged with "Squash and merge", and the title becomes the
# commit message on main, so the title is what the history will say.
#
# The action only reads the title. It does not check out or run the pull
# request's code, so `pull_request_target` (needed for pull requests from
# forks) is safe here.

name: pr-title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            style
            perf
            ci
            build
            revert
          requireScope: false
          # The description after "type: " starts with a lowercase letter,
          # as in "feat: add holds", not "feat: Add holds".
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The description "{subject}" in the title "{title}" must start with
            a lowercase letter, for example "feat: add holds".
