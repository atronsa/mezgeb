$kind: http-request
url: '{{baseUrl}}/oauth/token'
method: POST
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
body:
  type: text
  content: grant_type=client_credentials
auth:
  type: basic
  credentials:
    - key: username
      value: '{{clientId}}'
    - key: password
      value: not-the-secret
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('401 invalid_client', () => {
        pm.response.to.have.status(401);
        pm.expect(pm.response.json().error).to.equal('invalid_client');
        pm.expect(pm.response.headers.get('WWW-Authenticate')).to.include('Basic');
      });
order: 300
