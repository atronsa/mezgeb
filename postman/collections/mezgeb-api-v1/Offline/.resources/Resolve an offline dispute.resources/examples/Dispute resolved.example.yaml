$kind: http-example
request:
  url: "{{baseUrl}}/v1/offline/disputes/:dispute_id/resolve"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/problem+json
  pathVariables:
    - key: dispute_id
      value: 0192f3c4-0000-7000-8000-000000000f11
      disabled: false
      description: (Required) The dispute.
  body:
    type: json
    content: |-
      {
        "resolution": "paid"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:dispute_resolved",
        "title": "The dispute is already resolved the other way",
        "status": 409,
        "code": "dispute_resolved",
        "detail": "the dispute is already resolved as paid",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 5500
