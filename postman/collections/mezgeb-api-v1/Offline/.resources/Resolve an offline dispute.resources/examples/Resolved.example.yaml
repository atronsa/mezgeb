$kind: http-example
name: "The resolved dispute."
request:
  url: "{{baseUrl}}/v1/offline/disputes/:dispute_id/resolve"
  method: POST
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/json
  pathVariables:
    - key: dispute_id
      value: 0192f3c4-0000-7000-8000-000000000f11
      disabled: false
      description: (Required) The dispute.
  body:
    type: json
    content: |-
      {
        "resolution": "paid"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "0192f3c4-0000-7000-8000-000000000f11",
        "client": "0192f3c4-0000-7000-8000-00000000c11e",
        "device": "0192f3c4-0000-7000-8000-000000000d01",
        "voucher": "0192f3c4-0000-7000-8000-000000000e01",
        "reason": "conflict",
        "counter": 4,
        "status": "resolved",
        "resolution": "paid",
        "resolved_by": "ops:abebe"
      }
order: 1000
