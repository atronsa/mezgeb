$kind: http-request
url: '{{baseUrl}}/v1/accounts'
method: POST
headers:
  - key: Idempotency-Key
    value: 'smoke-{{runId}}-open-a'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "reference": "2010:cust-s{{runId}}-a"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('the same key replays the account', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.headers.get('Idempotent-Replayed')).to.equal('true');
        pm.expect(pm.response.json().id).to.equal(pm.collectionVariables.get('walletA'));
      });
order: 3000
