[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
# Our own crates, by path and version: crates.io needs the version to
# publish a crate that depends on another.
mezgeb-core = { path = "crates/core", version = "0.0.1" }
mezgeb-engine = { path = "crates/engine", version = "0.0.1" }
mezgeb-ops = { path = "crates/ops", version = "0.0.1" }
mezgeb-offline = { path = "crates/offline", version = "0.0.1" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
proptest = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
