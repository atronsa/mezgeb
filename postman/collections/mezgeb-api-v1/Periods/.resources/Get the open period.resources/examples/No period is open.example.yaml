$kind: http-example
request:
  url: "{{baseUrl}}/v1/periods/current"
  method: GET
  headers:
    - key: Authorization
      value: <token>
      description: "Added as a part of security scheme: oauth2"
    - key: Accept
      value: application/problem+json
  body:
    type: text
    content: ""
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    Content-Type: application/problem+json
  body:
    type: json
    content: |-
      {
        "type": "urn:mezgeb:problem:no_open_period",
        "title": "No accounting period is open",
        "status": 503,
        "code": "no_open_period",
        "detail": "No accounting period is open.",
        "instance": "urn:uuid:0192f3c4-0000-7000-8000-00000000abcd"
      }
order: 8000
