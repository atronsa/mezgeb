// Draft public API (spec §9). Batch-first: every write takes a list and
// returns one result per item, in order. 128-bit IDs are 16 raw bytes.
syntax = "proto3";
package mezgeb.v1;

service Ledger {
  rpc CreateAccounts(CreateAccountsRequest) returns (CreateAccountsResponse);
  rpc CreateTransfers(CreateTransfersRequest) returns (CreateTransfersResponse);
  rpc LookupAccounts(LookupRequest) returns (LookupAccountsResponse);
  rpc LookupTransfers(LookupRequest) returns (LookupTransfersResponse);
  rpc GetAccountHistory(AccountHistoryRequest) returns (LookupTransfersResponse);
  rpc IssueVoucher(IssueVoucherRequest) returns (Voucher);
  rpc IngestReceipts(IngestReceiptsRequest) returns (IngestReceiptsResponse);
  rpc ClosePeriod(ClosePeriodRequest) returns (ClosePeriodResponse);
}

message Account {
  bytes id = 1;
  uint32 ledger = 2;
  uint32 code = 3;
  uint32 flags = 4;
  int64 debits_pending = 5;
  int64 debits_posted = 6;
  int64 credits_pending = 7;
  int64 credits_posted = 8;
  bytes user_data = 9;
  uint64 created_at = 10;
}

message Transfer {
  bytes id = 1;
  bytes debit_account_id = 2;
  bytes credit_account_id = 3;
  int64 amount = 4;
  uint32 ledger = 5;
  uint32 code = 6;
  uint32 flags = 7;
  bytes pending_id = 8;
  uint32 timeout = 9;
  bytes user_data = 10;
  uint64 event_time = 11;
  uint64 recorded_time = 12;
}

// code 0 = ok; otherwise a stable error code from mezgeb-core::error.
message ItemResult {
  uint32 index = 1;
  uint32 code = 2;
}

message CreateAccountsRequest { repeated Account accounts = 1; }
message CreateAccountsResponse { repeated ItemResult results = 1; }
message CreateTransfersRequest { repeated Transfer transfers = 1; }
message CreateTransfersResponse { repeated ItemResult results = 1; }
message LookupRequest { repeated bytes ids = 1; }
message LookupAccountsResponse { repeated Account accounts = 1; }
message LookupTransfersResponse { repeated Transfer transfers = 1; }

message AccountHistoryRequest {
  bytes account_id = 1;
  uint64 after = 2;
  uint32 limit = 3;
}

message IssueVoucherRequest {
  bytes voucher_id = 1;
  bytes device_id = 2;
  uint32 tier = 3;
  bytes account_id = 4;
  int64 amount = 5;
  uint64 expires_at = 6;
  bytes device_public_key = 7;
}

message Voucher {
  bytes voucher_id = 1;
  bytes device_id = 2;
  uint64 counter_start = 3;
  int64 amount = 4;
  uint64 expires_at = 5;
  bytes issuer_signature = 6;
}

message Receipt {
  bytes device_id = 1;
  bytes voucher_id = 2;
  uint64 counter = 3;
  bytes prev_receipt_hash = 4;
  bytes payee_account_id = 5;
  int64 amount = 6;
  uint64 event_time = 7;
  bytes payer_signature = 8;
  bytes payee_ack_signature = 9;
}

message IngestReceiptsRequest { repeated Receipt receipts = 1; }
message IngestReceiptsResponse { repeated ItemResult results = 1; }

message ClosePeriodRequest { uint64 period_end = 1; }
message ClosePeriodResponse {
  bytes journal_hash = 1;
  bytes signature = 2;
}
